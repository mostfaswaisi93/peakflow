# =============================================================================
#  Module boundaries - COMPILED, not documented.
# =============================================================================
#  The dependency table in README.md IS this file. A boundary that is only
#  written down is a boundary that erodes: one import that seemed harmless,
#  then forty.
#
#  The two rules that matter most:
#
#  1. `Ledger` depends on nothing but `Tenancy` and `Support`. It must not know
#     what an invoice is. That is what makes the posting rules for a
#     jurisdiction changeable without touching `Sales`.
#
#  2. `Reporting` may read every module and may be depended upon by none. A
#     report that can be depended on has become a second source of truth, and
#     the whole promise of the product - that every balance is explainable from
#     the journal - depends on there being exactly one.
# =============================================================================

deptrac:
  paths:
    - ./app

  layers:
    - name: Support
      collectors:
        - type: directory
          value: app/Support/.*

    - name: Platform
      collectors:
        - type: directory
          value: app/Platform/.*

    - name: Identity
      collectors:
        - type: directory
          value: app/Tenant/Identity/.*

    - name: Tenancy
      collectors:
        - type: directory
          value: app/Tenant/Tenancy/.*

    - name: Ledger
      collectors:
        - type: directory
          value: app/Tenant/Ledger/.*

    - name: Parties
      collectors:
        - type: directory
          value: app/Tenant/Parties/.*

    - name: Catalog
      collectors:
        - type: directory
          value: app/Tenant/Catalog/.*

    - name: Tax
      collectors:
        - type: directory
          value: app/Tenant/Tax/.*

    - name: Sales
      collectors:
        - type: directory
          value: app/Tenant/Sales/.*

    - name: Purchasing
      collectors:
        - type: directory
          value: app/Tenant/Purchasing/.*

    - name: Banking
      collectors:
        - type: directory
          value: app/Tenant/Banking/.*

    - name: Inventory
      collectors:
        - type: directory
          value: app/Tenant/Inventory/.*

    - name: Settlement
      collectors:
        - type: directory
          value: app/Tenant/Settlement/.*

    - name: Sync
      collectors:
        - type: directory
          value: app/Tenant/Sync/.*

    - name: Payroll
      collectors:
        - type: directory
          value: app/Tenant/Payroll/.*

    - name: Messaging
      collectors:
        - type: directory
          value: app/Tenant/Messaging/.*

    - name: Reporting
      collectors:
        - type: directory
          value: app/Tenant/Reporting/.*

    - name: Exchange
      collectors:
        - type: directory
          value: app/Exchange/.*

  ruleset:
    # Depends on nothing. Every module may use it.
    Support: ~

    Platform:
      - Support
      - Identity

    Identity:
      - Support

    Tenancy:
      - Support
      - Identity

    # The ledger must not know what an invoice is.
    Ledger:
      - Support
      - Tenancy

    Parties:
      - Support
      - Tenancy

    # Master data, and deliberately unable to post.
    #
    # A price list has no business writing journal entries, so Catalog
    # gets neither Ledger nor anything transactional. Stock movements
    # looked like Catalog's and are not - they are documents, and they
    # live in `Inventory` for exactly this reason.
    Catalog:
      - Support
      - Tenancy

    # Stock: a document module, like Sales and Purchasing.
    #
    # Needs the item from Catalog and the ledger to post the cost of what
    # left. Nothing reads it except Reporting.
    Inventory:
      - Support
      - Tenancy
      - Ledger
      - Catalog

    Tax:
      - Support
      - Tenancy
      - Ledger

    Sales:
      - Support
      - Tenancy
      - Ledger
      - Parties
      - Catalog
      - Tax
      # A sale moves stock, and a return moves it back - PF-252.
      #
      # This direction and not the other. The sale is the event and the
      # movement is its consequence, so `Sales` knows about stock and
      # `Inventory` knows nothing about invoices: a stock module that
      # could read a document would be a second place the question "what
      # did this unit cost" is answered.
      - Inventory

    Purchasing:
      - Support
      - Tenancy
      - Ledger
      - Parties
      - Catalog
      - Tax

    Banking:
      - Support
      - Tenancy
      - Ledger
      - Parties

    Settlement:
      - Support
      - Tenancy
      - Ledger
      - Parties
      # Settling a document in another currency needs the rate for the
      # payment's value date, and rates are Catalog's - the same
      # dependency Sales and Purchasing have, for the same reason. The
      # alternative is a second rate lookup in this module, which would
      # be a second answer to "what was the rate that day".
      - Catalog
      - Sales
      - Purchasing
      - Banking

    # Delivering a document on a channel a customer reads - PF-257.
    #
    # Needs Parties for the customer, Exchange for the channel contract,
    # and the Ledger for nothing at all. A delivery is not a financial
    # event: an invoice is ISSUED and UNDELIVERED, which are two facts,
    # and a module that could post would be one network error away from
    # moving an issued document.
    #
    # It also reaches no document module. What was sent is recorded as a
    # type and an id, so an invoice, a credit note, a statement and a
    # receipt are all deliverable without Messaging learning what any of
    # them is - and without a column per document type.
    Messaging:
      - Support
      - Tenancy
      - Parties
      - Exchange

    # Salaries, through the same controls as every other payable - PF-256.
    #
    # Needs Parties for the employee, Ledger to post, and Purchasing for
    # nothing - the bills it raises are written as rows, because a
    # salary bill has no supplier document, no tax lines and no
    # three-way match, and reaching for the bill service would mean
    # teaching it about payroll.
    #
    # That is the one deliberate looseness here, and it is recorded
    # rather than hidden: `Payroll` writes to `bills` directly so that
    # `PaymentRuns` can select them with no knowledge of payroll at all.
    # A separate payment path for payroll is a separate path ROUND the
    # controls, and this is the cheapest way to have no second path.
    Payroll:
      - Support
      - Tenancy
      - Ledger
      - Parties

    # Writes from a device, applied exactly once - PF-255.
    #
    # Deliberately thin: Support for the audit trail, Tenancy for the
    # entity, and nothing else. Sync does not know what a sale IS - the
    # work is handed to it as a closure by whichever module owns the
    # document, so the idempotency ledger cannot grow a second
    # implementation of selling something.
    #
    # Which is also why nothing here reaches Ledger. A submission that
    # could post would be a second posting path, and the first thing to
    # follow would be a till that posts without a journal rule.
    Sync:
      - Support
      - Tenancy

    # Reads everything. Nothing reads it.
    Reporting:
      - Support
      - Tenancy
      - Identity
      - Ledger
      - Parties
      - Catalog
      - Tax
      - Sales
      - Purchasing
      - Banking
      - Settlement
      - Sync
      - Payroll
      - Messaging

    Exchange:
      - Support
      - Tenancy
      - Sales
      - Purchasing
