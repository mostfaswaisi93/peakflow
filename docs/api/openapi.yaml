openapi: 3.1.0

info:
  title: PeakFlow API
  version: 1.0.0-draft
  summary: Invoicing, banking and the double-entry ledger underneath them.
  description: |
    The PeakFlow REST API.

    **This document is the contract and it is written before the route.** A
    contract test asserts both directions: every operation and schema here
    exists in the application, and no undocumented route exists on the API
    surface. An API whose documentation is generated from its implementation
    documents whatever the implementation happens to do, including its
    mistakes.

    Conventions in full: `docs/api/conventions.md`. The points that catch
    integrators out:

    - **Money is always an object with a string amount.** Never a bare number.
      A client parsing `1.234` (a Jordanian dinar amount) as a float will
      reformat it to `1.23`.
    - **An accounting date is a date, not a timestamp**, and must never be
      timezone-shifted — `2026-11-30T21:00:00Z` in Riyadh is December.
    - **`Idempotency-Key` is required on every POST that posts to the ledger**,
      and a request without one is refused.
    - Pagination is cursor-based. The cursor is opaque and signed.
    - Errors are RFC 9457 `application/problem+json`, with document-rule
      failures addressed by EN 16931 business term rather than by XPath.

    This draft defines the shared components and a representative slice of the
    resource surface. Operations are added with the tasks that implement them,
    in the same pull request.
  contact:
    name: PeakFlow
    url: https://github.com/mostfaswaisi93/peakflow
  license:
    name: Proprietary
    url: https://github.com/mostfaswaisi93/peakflow/blob/main/LICENSE

servers:
  - url: https://{tenant}.peakflow.app/api/v1
    description: Production
    variables:
      tenant:
        default: example
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Ledger
    description: Accounts, journal entries, periods.
  - name: Sales
    description: Invoices, credit notes.
  - name: Settlement
    description: Payments, allocations, payment runs.
  - name: Banking
    description: Bank accounts, statements, reconciliation.
  - name: Reporting
    description: Statements and operational reports.

paths:

  /journal-entries:
    post:
      tags: [Ledger]
      operationId: createJournalEntry
      summary: Create a draft journal entry
      description: |
        Creates a **draft**. A draft has no effect on any balance and may be
        edited freely. Posting is a separate, irreversible operation.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryDraft' }
      responses:
        '201':
          description: Draft created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /journal-entries/{id}/post:
    post:
      tags: [Ledger]
      operationId: postJournalEntry
      summary: Post a draft journal entry
      description: |
        Irreversible. The entry must balance to zero in the entity's functional
        currency — enforced by a deferred constraint trigger in the database,
        not only by this endpoint — and its period must accept postings.

        Requires the `journal.post` permission, which in turn requires an
        enrolled second factor.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/PeriodClosed' }

  /invoices:
    get:
      tags: [Sales]
      operationId: listInvoices
      summary: List invoices
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [draft, issued, sent, partially_paid, paid, overdue, disputed, credited, written_off]
        - name: filter[party_id]
          in: query
          schema: { $ref: '#/components/schemas/Ulid' }
        - name: sort
          in: query
          description: Allowlisted. Anything else is a 400 naming what is permitted.
          schema:
            type: string
            enum: [issue_date, -issue_date, due_date, -due_date, number, -number]
      responses:
        '200':
          description: A page of invoices
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }

    post:
      tags: [Sales]
      operationId: createInvoice
      summary: Create a draft invoice
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceDraft' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /invoices/{id}/issue:
    post:
      tags: [Sales]
      operationId: issueInvoice
      summary: Issue a draft invoice
      description: |
        One transaction: validate, freeze totals, apply the posting rule,
        allocate the gapless number, write the hash-chain link, commit. It
        either all happens or none of it does. Rendering, delivery and any
        clearance submission are queued after commit.

        An issued invoice is immutable. Correct it with a credit note.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            Business-rule failure. Document-rule errors are addressed by
            EN 16931 business term.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423': { $ref: '#/components/responses/PeriodClosed' }

  /payments:
    post:
      tags: [Settlement]
      operationId: createPayment
      summary: Record a payment
      description: |
        A payment is cash moving. Allocation is a separate resource, because it
        is a separate event — often days later and by a different person.
        Unallocated cash is a liability, and that is correct rather than an
        error state.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentDraft' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /payment-runs/{id}/release:
    post:
      tags: [Settlement]
      operationId: releasePaymentRun
      summary: Release a prepared payment run
      description: |
        The highest-consequence operation in the API.

        - The releaser must differ from the preparer, enforced against the
          audit trail rather than against a role list.
        - Requires step-up re-authentication at the moment of the act, so a
          stolen session is not enough.
        - Any change since preparation invalidates the preparation.
        - A beneficiary account changed since approval blocks the release until
          it is re-verified.

        PeakFlow never moves money. This produces an instruction file that a
        human releases into the bank's own channel.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
        - name: X-Step-Up-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Released
        '403':
          description: |
            Forbidden — lacking the permission, failing segregation of duties,
            or a stale step-up assertion.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /statements:
    post:
      tags: [Banking]
      operationId: importStatement
      summary: Import a bank statement
      description: |
        The import asserts that its opening balance equals the previous
        statement's closing balance for the account. A mismatch stops the
        import and reports the gap rather than importing a hole.

        Imports are idempotent: re-importing an overlapping file is a no-op
        that reports what it skipped.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bank_account_id, format, file]
              properties:
                bank_account_id: { $ref: '#/components/schemas/Ulid' }
                format:
                  type: string
                  enum: [camt053, camt052, camt054, mt940, mt942, ofx, csv]
                csv_template_id: { $ref: '#/components/schemas/Ulid' }
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  statement_id: { $ref: '#/components/schemas/Ulid' }
                  imported:     { type: integer }
                  skipped:      { type: integer, description: Already present. }
                  continuity:   { type: string, enum: [ok, first_statement] }
        '422':
          description: |
            Continuity broken, or the file is not what it claims to be. The
            problem detail names the expected and actual opening balance.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reports/trial-balance:
    get:
      tags: [Reporting]
      operationId: getTrialBalance
      summary: Trial balance
      description: |
        Reproducible: the same parameters return the same numbers, and the
        parameters are echoed on the response. Debits must equal credits, and
        the response says so explicitly.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Entity'
        - name: as_of
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AccountingDate' }
        - name: include_adjusting
          in: query
          schema: { type: boolean, default: true }
        - name: currency
          in: query
          description: Presentation currency. Defaults to the entity's functional currency.
          schema: { $ref: '#/components/schemas/CurrencyCode' }
      responses:
        '200':
          description: The trial balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A Sanctum token. Scopes mirror permissions exactly, so there is one
        authorization model rather than a second, weaker one for machines. A
        token is scoped to specific entities, not to the whole tenant.

  parameters:
    Tenant:
      name: X-Tenant
      in: header
      required: true
      description: |
        Resolved before authentication, because the user table lives in the
        tenant's own database.
      schema: { $ref: '#/components/schemas/Ulid' }

    Entity:
      name: X-Entity
      in: header
      required: true
      description: The legal entity to act in. The token must hold a role in it.
      schema: { $ref: '#/components/schemas/Ulid' }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every POST that posts to the ledger; a request without one
        is refused. The response is stored and replayed for 24 hours. A replay
        with a different body is a 409 — that is a client bug, and silently
        returning the first response would hide it.
      schema: { type: string, minLength: 16, maxLength: 128 }

    ResourceId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }

    Cursor:
      name: cursor
      in: query
      description: Opaque and signed, so it cannot be tampered with or hand-constructed.
      schema: { type: string }

    Limit:
      name: limit
      in: query
      description: Allowlisted, so a crafted value can never request an unbounded page.
      schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }

  headers:
    ETag:
      description: Strong and permanently cacheable on an immutable resource.
      schema: { type: string }
    Link:
      description: RFC 8288 pagination links.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed, or a filter or sort field not on the allowlist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated, but lacking the permission, the entity scope, or failing
        a segregation-of-duties rule.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: An idempotency conflict, or a transition the state machine does not allow.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Validation or business-rule failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PeriodClosed:
      description: The target period is closed or locked.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      examples: ['01JD3XQ7F8K2M9N4P5R6S7T8V9']

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217. The minor unit is not always 2.
      examples: ['SAR', 'JOD', 'JPY']

    AccountingDate:
      type: string
      format: date
      description: |
        A date, never a timestamp. An accounting date that can be
        timezone-shifted is a period-allocation bug.
      examples: ['2026-11-14']

    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      description: |
        Money is always an object with a string amount. A bare number is never
        returned — a client parsing it as a float is the bug this prevents.
      properties:
        amount:
          type: string
          pattern: '^-?\d{1,17}\.\d{4}$'
          description: Exact decimal at the storage scale (4 places). Never a JSON number.
          examples: ['1150.0000', '-42.9629']
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        presentation_exponent:
          type: integer
          minimum: 0
          maximum: 4
          description: From ISO 4217. The client formats; the server does not pre-format.

    Problem:
      type: object
      required: [type, title, status]
      description: RFC 9457 problem details.
      properties:
        type:     { type: string, format: uri, description: From a documented registry. }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON pointer into the request body.
              business_term:
                type: string
                pattern: '^BT-\d{1,3}$'
                description: |
                  EN 16931 business term. Document-rule failures are addressed
                  this way rather than by XPath — users do not read XPath.
              code:
                type: string
                description: A validation key, or an EN 16931 rule id such as BR-CO-14.
              detail: { type: string }

    Page:
      type: object
      properties:
        meta:
          type: object
          properties:
            limit:    { type: integer }
            has_more: { type: boolean }
        links:
          type: object
          properties:
            self: { type: string }
            next: { type: string }

    JournalEntryDraft:
      type: object
      required: [journal_id, accounting_date, lines]
      properties:
        journal_id:      { $ref: '#/components/schemas/Ulid' }
        accounting_date: { $ref: '#/components/schemas/AccountingDate' }
        narration:       { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required: [account_id, amount]
            properties:
              account_id:
                allOf: [{ $ref: '#/components/schemas/Ulid' }]
                description: |
                  A control account is refused — only a registered posting rule
                  may post to one.
              amount:
                allOf: [{ $ref: '#/components/schemas/Money' }]
                description: |
                  Signed. Debits positive, credits negative. Must not be zero.
                  The lines must sum to zero in the entity's functional
                  currency.
              fx_rate:    { type: string }
              party_id:   { $ref: '#/components/schemas/Ulid' }
              dimensions:
                type: object
                additionalProperties: { $ref: '#/components/schemas/Ulid' }
              narration:  { type: string }

    JournalEntry:
      allOf:
        - $ref: '#/components/schemas/JournalEntryDraft'
        - type: object
          properties:
            id:        { $ref: '#/components/schemas/Ulid' }
            number:    { type: string }
            status:    { type: string, enum: [draft, posted, reversed] }
            period_id: { $ref: '#/components/schemas/Ulid' }
            posted_by: { $ref: '#/components/schemas/Ulid' }
            posted_at: { type: string, format: date-time }
            reversed_by_entry_id: { $ref: '#/components/schemas/Ulid' }

    InvoiceDraft:
      type: object
      required: [party_id, document_type, currency, issue_date, lines]
      properties:
        party_id:      { $ref: '#/components/schemas/Ulid' }
        document_type:
          type: string
          enum: ['380', '381', '383', '384', '386', '389']
          description: UNCL 1001.
        currency:      { $ref: '#/components/schemas/CurrencyCode' }
        issue_date:    { $ref: '#/components/schemas/AccountingDate' }
        tax_point_date:
          allOf: [{ $ref: '#/components/schemas/AccountingDate' }]
          description: |
            EN 16931 BT-7. Derived by the jurisdiction rule when omitted, and
            frozen on issue. Determines the return period, which can differ
            from the accounting period.
        delivery_date: { $ref: '#/components/schemas/AccountingDate' }
        payment_terms_id: { $ref: '#/components/schemas/Ulid' }
        buyer_reference:  { type: string, description: 'BT-10. Mandatory under some CIUS.' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unit_price, tax_code_id]
            properties:
              item_id:     { $ref: '#/components/schemas/Ulid' }
              description: { type: string, description: 'BT-153. Frozen, so renaming an item later does not rewrite history.' }
              quantity:    { type: string, pattern: '^-?\d{1,15}\.\d{6}$' }
              unit_of_measure: { type: string, description: 'UN/CEFACT Rec 20.' }
              unit_price:
                type: string
                pattern: '^-?\d{1,13}\.\d{8}$'
                description: Eight decimals, so per-litre and per-kWh pricing needs no scaling factor.
              tax_code_id: { $ref: '#/components/schemas/Ulid' }
              dimensions:
                type: object
                additionalProperties: { $ref: '#/components/schemas/Ulid' }

    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceDraft'
        - type: object
          properties:
            id:     { $ref: '#/components/schemas/Ulid' }
            number: { type: string, description: 'From the gapless series. Absent while draft.' }
            status:
              type: string
              enum: [draft, issued, sent, partially_paid, paid, overdue, disputed, credited, written_off]
            net:   { $ref: '#/components/schemas/Money' }
            tax:   { $ref: '#/components/schemas/Money' }
            gross: { $ref: '#/components/schemas/Money' }
            amount_due: { $ref: '#/components/schemas/Money' }
            tax_breakdown:
              type: array
              description: |
                EN 16931 BG-23. One entry per unique (category, rate) pair. The
                document tax total equals the sum of these — BR-CO-14.
              items:
                type: object
                properties:
                  category:       { type: string, enum: [S, Z, E, AE, O, K, G], description: 'UNCL 5305.' }
                  rate:           { type: string }
                  taxable_amount: { $ref: '#/components/schemas/Money' }
                  tax_amount:     { $ref: '#/components/schemas/Money' }
                  exemption_reason: { type: string, description: 'BT-120. Mandatory for E, Z, AE, K, G.' }
            canonical_hash: { type: string, description: 'SHA-256 over the canonicalized legally significant fields.' }
            previous_hash:  { type: string, description: 'The preceding document in the same series.' }
            chain_index:    { type: integer }
            transmission:
              type: object
              description: |
                The document is issued; its transmission may be pending. A
                transport outage is a queue depth, not a failed issue.
              properties:
                status:    { type: string, enum: [not_required, pending, sent, cleared, rejected] }
                profile:   { type: string }
                reference: { type: string }
                message:   { type: string, description: "The authority's own message, verbatim." }

    PaymentDraft:
      type: object
      required: [direction, bank_account_id, value_date, amount]
      properties:
        direction:       { type: string, enum: [receipt, disbursement] }
        bank_account_id: { $ref: '#/components/schemas/Ulid' }
        party_id:        { $ref: '#/components/schemas/Ulid' }
        value_date:      { $ref: '#/components/schemas/AccountingDate' }
        amount:          { $ref: '#/components/schemas/Money' }
        method:          { type: string, description: 'UNCL 4461.' }
        reference:       { type: string }

    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentDraft'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            allocated:   { $ref: '#/components/schemas/Money' }
            unallocated:
              allOf: [{ $ref: '#/components/schemas/Money' }]
              description: |
                Unallocated cash is a liability, and that is correct rather than
                an error state.

    TrialBalance:
      type: object
      properties:
        parameters:
          type: object
          description: Echoed so the output is self-describing and reproducible.
          properties:
            entity_id:         { $ref: '#/components/schemas/Ulid' }
            as_of:             { $ref: '#/components/schemas/AccountingDate' }
            include_adjusting: { type: boolean }
            currency:          { $ref: '#/components/schemas/CurrencyCode' }
        balances:
          type: array
          items:
            type: object
            properties:
              account_id:   { $ref: '#/components/schemas/Ulid' }
              account_code: { type: string }
              account_name: { type: string }
              debit:        { $ref: '#/components/schemas/Money' }
              credit:       { $ref: '#/components/schemas/Money' }
        totals:
          type: object
          properties:
            debit:  { $ref: '#/components/schemas/Money' }
            credit: { $ref: '#/components/schemas/Money' }
            balanced:
              type: boolean
              description: |
                Asserted, not assumed. A trial balance that does not balance
                says so prominently rather than printing.
