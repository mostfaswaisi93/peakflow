components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A Sanctum bearer token, and nothing else: the cookie fallback is
        switched off, so a session cookie cannot authenticate an API request.
        Two holes close with it - CSRF, because a browser attaches cookies to
        a cross-site POST on its own, and the scope model, because a
        session-authenticated request carries every ability its user holds.

        **Scopes are permission keys**, spelled identically, so there is one
        authorization model rather than a second and weaker one for machines.
        There is no wildcard: `*` names no permission and would widen itself
        with every deployment that adds one.

        A token is scoped to **specific entities**, never to the tenant.

  parameters:
    Tenant:
      name: X-Tenant
      in: header
      required: true
      description: |
        Resolved **before** authentication, because the users table lives in
        the tenant's own database and a guard that ran first would query
        whichever connection happened to be configured.

        A missing header is a `400` and not a guess. "They only have one
        tenant, so use that" is how an integration silently writes into the
        wrong company after the customer adds a second one.
      schema: {"$ref": "#/components/schemas/Ulid"}

    Entity:
      name: X-Entity
      in: header
      required: true
      description: |
        The legal entity to act in, and it is **required even when the token
        names exactly one**. The browser can guess because a person is
        watching and will notice the wrong company's figures; an integration
        will not, and the failure is silent and cumulative.
      schema: {"$ref": "#/components/schemas/Ulid"}

    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Localizes the human-readable `detail` and `errors[].detail` of a
        problem document, and nothing else. `type`, `title` and every
        machine-readable member are never localized - a client switching on
        `title` would break the first time somebody sent `ar`, and it would
        break by taking the wrong branch rather than by failing.

        On the API this header **outranks the tenant's default language**,
        which is the opposite of the application's own ordering. An
        integration sending it has stated the language of the system - or the
        person - that will read the failure, per request, in code somebody
        wrote on purpose.

        The response carries `Content-Language`.
      schema: {"type": "string", "enum": ["ar", "en"]}

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every POST that posts to the ledger; a request without one
        is refused rather than accepted. Between 16 and 128 characters - a
        short key is not a unique key, it collides with this same token's next
        request.

        The response is stored and replayed for 24 hours, keyed on the tenant,
        the token and the key. A replay with a **different body** is a `409`,
        because that is a client bug and silently returning the first response
        would hide it: the second write would never happen, its id would be
        recorded against the first document, and the discrepancy would surface
        weeks later as a document nobody can find.

        A request arriving while the first is still running is a `409` with
        `Retry-After` rather than a second execution. Two requests arriving
        together are answered by the database: the second blocks on the
        claim, and when the first commits it replays the first's response.

        A `5xx` is not stored. Replaying one for 24 hours would mean the
        client could never succeed with that key, and the key is the only
        thing it is permitted to retry with.
      schema: {"type": "string", "minLength": 16, "maxLength": 128}

    ResourceId:
      name: id
      in: path
      required: true
      schema: {"$ref": "#/components/schemas/Ulid"}

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque and **signed**, so it cannot be tampered with or
        hand-constructed, and bound to the listing and sort that produced it -
        the same string against a different sort would compare an account code
        to a date. Send back exactly what was received; anything else is a
        `400`.
      schema: {"type": "string"}

    Limit:
      name: limit
      in: query
      required: false
      description: |
        An **allowlist**, not a ceiling. A ceiling answers `limit=99999` with a
        page of 100 and says nothing, which is a silent reinterpretation of
        what was asked - the client believes it has every row and iterates no
        further. Anything else is a `400` naming the four sizes that work.
      schema: {"type": "integer", "enum": [10, 25, 50, 100], "default": 25}

    ReportPeriod:
      name: period
      in: query
      required: false
      description: |
        A period id from `GET /periods`. Without one, the latest period that
        has anything posted in it - an empty current month would otherwise be
        the default, and a report of nothing answers nobody's question.
      schema: {"$ref": "#/components/schemas/Ulid"}

    ReportComparative:
      name: comparative
      in: query
      required: false
      description: |
        An earlier period's id, or `none`. Without it, the same period a year
        earlier, and none when there is no such period.
      schema: {"type": "string"}

    PageNumber:
      name: page
      in: query
      required: false
      description: |
        Offset pagination, available where a UI genuinely needs a page number
        and **documented as the slower path**. `OFFSET 50000` reads fifty
        thousand rows in order to discard them, and over a journal that is
        still being written to the pages also drift: one insert between
        request five and request six shifts every later row by one, so a
        client sees one entry twice and never sees another.

        Capped at 200. Sending `page` selects offset mode and ignores
        `cursor`; the response says which mode answered it.
      schema: {"type": "integer", "minimum": 1, "maximum": 200}

  headers:
    ETag:
      description: A strong validator over the bytes served.
      schema: {"type": "string"}
    Link:
      description: RFC 8288 pagination links - `rel="next"` and `rel="prev"`.
      schema: {"type": "string"}
    Location:
      description: The created resource.
      schema: {"type": "string"}
    RetryAfter:
      description: Seconds to wait. Present on every refusal that asks for one.
      schema: {"type": "integer"}
    ContentLanguage:
      description: The language the human-readable text was written in.
      schema: {"type": "string"}
    IdempotentReplay:
      description: |
        `true` when this response is the stored answer to an earlier request
        with the same key, rather than a fresh execution.
      schema: {"type": "string"}
    CacheControlNoStore:
      description: |
        `no-store`. The body is a credential, and a cache, a service worker or
        a debugging proxy that kept it would be keeping a password.
      schema: {"type": "string", "const": "no-store"}
    RateLimitLimit:
      description: Requests allowed per minute in this bucket - reads and writes are separate.
      schema: {"type": "integer"}
    RateLimitRemaining:
      description: Requests left in this bucket this minute.
      schema: {"type": "integer"}
    RateLimitReset:
      description: Seconds until this bucket refills.
      schema: {"type": "integer"}

  responses:
    BadRequest:
      description: |
        Malformed, or a filter, sort field, page size or cursor outside what is
        permitted. The problem document lists what IS permitted.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            sortNotAllowed:
              summary: A sort field that is not on the allowlist
              value: {"type": "https://peakflow.app/problems/filter-not-allowed", "title": "That filter or sort field is not permitted", "status": 400, "detail": "\"narration\" is not a sortable field here.", "instance": "/api/v1/accounts?sort=narration", "errors": [{"pointer": "/sort", "code": "not_allowed", "detail": "narration"}], "permitted": ["code", "created_at"]}

    Unauthenticated:
      description: |
        No token, an unknown token, an expired or revoked one, or a token from
        another plane. All four answer the same way: confirming that a token
        is real and simply not usable here is the one fact worth having.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            noToken:
              summary: No bearer token
              value: {"type": "https://peakflow.app/problems/unauthenticated", "title": "Authentication is required", "status": 401, "detail": "Send a bearer token in the Authorization header. The API accepts no other credential.", "instance": "/api/v1/accounts"}

    Forbidden:
      description: |
        Authenticated, and not permitted. Three distinct types, because the fix
        differs: `token-scope-missing` is fixed by issuing a new token,
        `forbidden` by granting a permission, `entity-not-permitted` by
        issuing a token for that entity.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            scopeMissing:
              summary: The token was issued without the scope
              value: {"type": "https://peakflow.app/problems/token-scope-missing", "title": "The token does not carry this scope", "status": 403, "detail": "This route needs the scope journal.post and the token carries report.view.", "instance": "/api/v1/journal-entries", "errors": [{"pointer": "/scopes", "code": "scope_missing", "detail": "journal.post"}]}
            entityNotPermitted:
              summary: An entity outside the token's list
              value: {"type": "https://peakflow.app/problems/entity-not-permitted", "title": "This token may not act in that entity", "status": 403, "detail": "This token may act in 01jd3xq7f8k2m9n4p5r6s7t8v8, and 01jd3xq7f8k2m9n4p5r6s7t8vz is not among them.", "instance": "/api/v1/accounts"}

    NotFound:
      description: |
        No such record is visible to this token. A record that exists and is
        not visible is reported identically to one that does not exist -
        distinguishing them tells an attacker which ids and which document
        numbers are real.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            notFound:
              summary: An id from another entity, or none at all
              value: {"type": "https://peakflow.app/problems/not-found", "title": "Not found", "status": 404, "detail": "No such record is visible to this token.", "instance": "/api/v1/journal-entries/01jd3xq7f8k2m9n4p5r6s7t8vz"}

    Conflict:
      description: |
        An idempotency conflict, a request still in flight, or a transition
        the state machine does not allow.
      headers:
        Retry-After: {"$ref": "#/components/headers/RetryAfter"}
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            keyReused:
              summary: The same key with a different body
              value: {"type": "https://peakflow.app/problems/idempotency-key-conflict", "title": "The Idempotency-Key was reused with a different body", "status": 409, "detail": "The key \"7c0f3d1e4b5a6978f0a1b2c3d4e5\" was already used for a different request.", "instance": "/api/v1/journal-entries"}
            stillRunning:
              summary: The first request with this key has not committed
              value: {"type": "https://peakflow.app/problems/idempotency-key-in-flight", "title": "The first request with this Idempotency-Key is still running", "status": 409, "detail": "The first request with key \"7c0f3d1e4b5a6978f0a1b2c3d4e5\" is still running and has not committed.", "instance": "/api/v1/journal-entries", "retry_after": 2}

    Stale:
      description: |
        The document changed after the decision being made about it was
        asked for - an approval chain about a bill that has since been
        edited. The chain starts again from the beginning; re-read the
        document.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            changed:
              summary: The bill was edited while it was being approved
              value: {"type": "https://peakflow.app/problems/stale-write", "title": "The record has changed since it was read", "status": 412, "detail": "The document has changed since the chain started, so this approval would be about a different document.", "instance": "/api/v1/bills/01jd3xq7f8k2m9n4p5r6s7t8vc/approve"}

    ValidationFailed:
      description: |
        A field or a business rule. Field errors are addressed by RFC 6901
        JSON pointer into the request body; document-rule failures are
        addressed by **EN 16931 business term** rather than by XPath or by an
        internal field name.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            lineProblems:
              summary: A control account, and an entry that does not balance
              value: {"type": "https://peakflow.app/problems/validation-failed", "title": "The request could not be validated", "status": 422, "detail": "The entry was not posted: 1 line problem(s), and it is out by 250.0000 SAR.", "instance": "/api/v1/journal-entries", "errors": [{"pointer": "/lines/0/account_code", "code": "account_is_a_control", "detail": "Account 1.1.2.1 is a control account (trade_receivable): its balance is the total of a subledger, and the documents post to it. A manual entry makes the two disagree and nothing afterwards can say which is right."}], "imbalance": {"amount": "250.0000", "currency": "SAR", "presentation_exponent": 2}, "imbalance_side": "credit"}
            documentRule:
              summary: A document rule, addressed by business term
              value: {"type": "https://peakflow.app/problems/document-validation-failed", "title": "The document does not satisfy its business rules", "status": 422, "detail": "The document breaks one or more business rules.", "instance": "/api/v1/invoices/01jd3xq7f8k2m9n4p5r6s7t8v9/issue", "errors": [{"business_term": "BT-110", "code": "BR-CO-14", "detail": "The tax total does not equal the sum of the VAT breakdown."}]}

    PeriodClosed:
      description: |
        The target period is closed or locked. A closed period has been
        reported on; posting into it after the fact changes a figure somebody
        has already acted upon.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            closed:
              summary: The period will not accept the posting
              value: {"type": "https://peakflow.app/problems/period-not-accepting-postings", "title": "The accounting period does not accept postings", "status": 423, "detail": "The period this date falls in has been closed. A closed period has been reported on.", "instance": "/api/v1/journal-entries"}

    ServerError:
      description: |
        The request failed on our side. Nothing was half-saved - an idempotent
        write rolls back its claim with it, so the same key may be retried -
        and the correlation id is what joins this response to the log line.
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            failed:
              summary: A server failure
              value: {"type": "https://peakflow.app/problems/server-error", "title": "Something went wrong", "status": 500, "detail": "The request failed on our side. Nothing was half-saved; quote the correlation id when reporting it.", "instance": "/api/v1/journal-entries"}

    SignInRefused:
      description: |
        The workspace, address, password or code was not accepted. One type
        and one sentence for every cause - see `POST /auth/sign-in`.
      headers:
        Cache-Control: {"$ref": "#/components/headers/CacheControlNoStore"}
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            refused:
              summary: Any sign-in failure
              value: {"type": "https://peakflow.app/problems/sign-in-refused", "title": "The sign-in was refused", "status": 401, "detail": "The workspace, email address, password or code was not accepted. Check them and try again.", "instance": "/api/v1/auth/sign-in"}

    RateLimited:
      description: |
        Too many requests. Per tenant and per token for an authenticated call,
        reads and writes in separate buckets with writes the tighter; per
        account and per address for a sign-in; per address for a refresh.

        The `RateLimit-*` headers are on **every** response from an
        authenticated operation, not only this one, so a client can slow down
        before it is refused rather than finding the limit by hitting it.
      headers:
        Retry-After: {"$ref": "#/components/headers/RetryAfter"}
        RateLimit-Limit: {"$ref": "#/components/headers/RateLimitLimit"}
        RateLimit-Remaining: {"$ref": "#/components/headers/RateLimitRemaining"}
        RateLimit-Reset: {"$ref": "#/components/headers/RateLimitReset"}
      content:
        application/problem+json:
          schema: {"$ref": "#/components/schemas/Problem"}
          examples:
            slowDown:
              summary: The bucket is empty for now
              value: {"type": "https://peakflow.app/problems/rate-limited", "title": "Too many requests", "status": 429, "detail": "Too many requests on this token. Retry after the interval in Retry-After.", "instance": "/api/v1/journal-entries", "retry_after": 37}

  schemas:

    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      description: |
        Crockford base32, 26 characters, sortable by creation time.

        **Either case.** Crockford is case-insensitive as a specification, and
        this application emits both: a model-generated id is lower case, and
        one generated directly by the framework helper is upper. An id is
        therefore OPAQUE - compare it case-insensitively, or better, echo back
        exactly the bytes you were given. Normalizing the case of an id before
        sending it back is how a client gets 404s it cannot explain, because
        the column behind it is `char(26)` and compares as a string.
      examples: ["01jd3xq7f8k2m9n4p5r6s7t8v9"]

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217. The minor unit is not always 2.
      examples: ["SAR", "JOD", "JPY"]

    AccountingDate:
      type: string
      format: date
      description: |
        A date, never a timestamp. Midnight on the 30th in UTC is 03:00 on the
        30th in Riyadh, and midnight on the 1st in Riyadh is 21:00 on the 30th
        in UTC - so a timestamp for an accounting date is one conversion away
        from moving an entry into another month, another quarter and another
        tax return. Nobody finds it, because both dates are plausible.
      examples: ["2026-11-14"]

    Timestamp:
      type: string
      format: date-time
      description: |
        A moment: RFC 3339, UTC, with a `Z`. A client that has to know which
        zone a timestamp is in before it can order two of them has been handed
        the ordering problem, and the first symptom is a log that appears to
        go backwards for one hour twice a year.
      examples: ["2026-11-14T09:31:22Z"]

    Money:
      type: object
      required: ["amount", "currency"]
      additionalProperties: false
      description: |
        Money is **always** an object with a string amount. A bare number is
        never returned: `JOD 1.234` as the JSON number `1.234` arrives in
        JavaScript as the nearest double, which is
        1.23399999999999998578914528479799628257751464843750, and every client
        that formats it with two decimals - which is every client, because two
        is the default everywhere - writes 1.23 on an invoice for a
        three-decimal currency. The lines then no longer sum to the total, and
        the difference is a third of a fils per line.
      properties:
        amount:
          type: string
          pattern: '^-?\d{1,17}\.\d{4}$'
          description: |
            Exact decimal at the storage scale - four places, whatever the
            currency's own exponent is. Never a JSON number.
          examples: ["1150.0000", "-42.9629"]
        currency: {"$ref": "#/components/schemas/CurrencyCode"}
        presentation_exponent:
          type: integer
          minimum: 0
          maximum: 4
          description: |
            From ISO 4217. The client formats; the server does not
            pre-format. A server that sent `"1.23"` for a JOD amount would
            have made the float mistake one layer earlier and hidden the
            evidence.

    ProblemError:
      type: object
      description: One addressed error inside a problem document.
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON pointer into the request body, zero-indexed.
        business_term:
          type: string
          pattern: '^BT-\d{1,3}$'
          description: |
            EN 16931 business term. Document-rule failures are addressed this
            way rather than by XPath - users do not read XPath, and neither do
            integrators.
        code:
          type: string
          description: A validation key, or an EN 16931 rule id such as `BR-CO-14`.
        detail:
          type: string
          description: Localized by `Accept-Language`.

    Problem:
      type: object
      required: ["type", "title", "status", "detail", "instance"]
      description: |
        RFC 9457 problem details, served as `application/problem+json`.

        Every `type` is a URI in the documented registry at
        `docs/api/problems.md`. An error type is a contract a client switches
        on, not something invented at the call site - a client that had to
        parse `detail` to tell a closed period from a missing permission would
        have no contract at all.
      properties:
        type:
          type: string
          format: uri
          description: From the registry. Never localized.
        title:
          type: string
          description: Short, stable, English. Never localized; never switch on it.
        status: {"type": "integer"}
        detail:
          type: string
          description: For the person who will read it. Localized by `Accept-Language`.
        instance: {"type": "string", "format": "uri-reference"}
        errors:
          type: array
          items: {"$ref": "#/components/schemas/ProblemError"}
        retry_after:
          type: integer
          description: |
            Also sent as the `Retry-After` header. Both, because they are read
            by different things: the header by any HTTP client library with no
            code written, the member by somebody reading a logged response
            without the headers beside it.

    PageMeta:
      type: object
      required: ["limit", "has_more", "pagination"]
      properties:
        limit: {"type": "integer"}
        has_more: {"type": "boolean"}
        pagination:
          type: string
          enum: ["cursor", "offset"]
          description: |
            Which mode answered. A client that asked for `page=3` and silently
            got a cursor page would page through the wrong thing while
            everything looked fine.
        page:
          type: integer
          description: Present in offset mode only.

    PageLinks:
      type: object
      description: |
        The same URLs as the `Link` header. Both, for the same reason as
        `Retry-After`: a generic client follows `rel="next"` with no code
        written, and somebody reading a logged response has no headers.
      properties:
        self: {"type": "string"}
        next: {"type": "string"}
        prev: {"type": "string"}

    Account:
      type: object
      required: ["resource", "id", "code", "name", "depth", "type", "postable", "blocked", "monetary"]
      properties:
        resource: {"type": "string", "const": "account"}
        id: {"$ref": "#/components/schemas/Ulid"}
        code:
          type: string
          description: |
            The code IS the position in the tree - the meaning of `1.1.4` is
            where it sits - so this is also the sort order.
        name:
          type: object
          required: ["ar", "en"]
          properties:
            ar: {"type": "string"}
            en: {"type": "string"}
        parent_id: {"type": ["string", "null"]}
        depth: {"type": "integer"}
        type: {"type": "string", "enum": ["asset", "liability", "equity", "revenue", "expense"]}
        currency:
          oneOf: [{"$ref": "#/components/schemas/CurrencyCode"}, {"type": "null"}]
          description: |
            A currency-restricted account, where there is one. Null means "any
            enabled currency", which is a different fact from "the functional
            currency" - a client that filled the null in would refuse a
            legitimate EUR line to a general account.
        postable:
          type: boolean
          description: |
            False for a group heading. A balance on one is explained by none of
            its children and lost by every drill-down.
        blocked: {"type": "boolean"}
        monetary:
          type: boolean
          description: Whether it is revalued at a reporting date - IAS 21.

    AccountPage:
      type: object
      required: ["data", "meta", "links"]
      properties:
        data:
          type: array
          items: {"$ref": "#/components/schemas/Account"}
        meta: {"$ref": "#/components/schemas/PageMeta"}
        links: {"$ref": "#/components/schemas/PageLinks"}

    FxProvenance:
      type: object
      required: ["rate", "as_of"]
      description: |
        WHICH rate, not merely what number - PF-069. The value alone cannot
        answer "was it current", "was it the statutory rate" or "which feed
        said so", and looking it up again later cannot either: it may have been
        superseded, and two feeds can send the same figure for different days.
      properties:
        rate:
          type: string
          description: |
            An exact decimal string, like every other figure here. Null when
            nothing was translated, and **never 1** - a rate of 1 asserts that
            a translation happened and came out even, which is a different
            claim from no translation at all.
        rate_set: {"type": ["string", "null"]}
        as_of: {"$ref": "#/components/schemas/AccountingDate"}
        provider: {"type": ["string", "null"]}

    JournalEntryLine:
      type: object
      required: ["id", "account_id", "amount", "functional_amount"]
      properties:
        id: {"$ref": "#/components/schemas/Ulid"}
        account_id: {"$ref": "#/components/schemas/Ulid"}
        amount:
          allOf: [{"$ref": "#/components/schemas/Money"}]
          description: |
            What the line is DENOMINATED in. Signed: debits positive, credits
            negative, which is the only convention under which "the lines sum
            to zero" is a sentence a client can check for itself.
        functional_amount:
          allOf: [{"$ref": "#/components/schemas/Money"}]
          description: |
            What the ledger balances on. The same figure as `amount` only when
            there was no translation - a client given one of them cannot tell
            which case it is in, and an integration reconciling a euro bank
            account against a riyal ledger needs both.
        fx:
          oneOf: [{"$ref": "#/components/schemas/FxProvenance"}, {"type": "null"}]
        party_id: {"type": ["string", "null"]}
        narration: {"type": ["string", "null"]}

    JournalEntry:
      type: object
      required: ["resource", "id", "number", "status", "accounting_date", "period_id", "journal_id", "currency"]
      properties:
        resource: {"type": "string", "const": "journal_entry"}
        id: {"$ref": "#/components/schemas/Ulid"}
        number:
          type: string
          description: From the gapless series. A gap is a question an auditor asks that nobody can answer.
        status: {"type": "string", "enum": ["draft", "posted", "reversed"]}
        accounting_date: {"$ref": "#/components/schemas/AccountingDate"}
        period_id: {"$ref": "#/components/schemas/Ulid"}
        journal_id: {"$ref": "#/components/schemas/Ulid"}
        narration: {"type": ["string", "null"]}
        posting_rule:
          type: ["string", "null"]
          description: |
            Which rule produced this, so a balance traces back not only to a
            document but to the reason it posted the way it did.
        source:
          type: object
          properties:
            type: {"type": ["string", "null"]}
            reference:
              type: ["string", "null"]
              description: |
                The document or event that caused the posting, where there was
                one; null for a manual entry.

                Deliberately **not** the client's `Idempotency-Key`. The
                column behind it is a ULID, and a key is whatever the client
                generated, so one would truncate or fail depending on its
                length. The mapping from a key to the document it produced is
                the idempotency record, which exists for the 24 hours the
                guarantee does - after that, the client has the id from the
                response it was given.
        posted_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
        posted_by_user_id: {"type": ["string", "null"]}
        currency:
          allOf: [{"$ref": "#/components/schemas/CurrencyCode"}]
          description: The entity's functional currency, which is what the entry balances in.

    JournalEntryDetail:
      allOf:
        - {"$ref": "#/components/schemas/JournalEntry"}
        - type: object
          required: ["lines"]
          properties:
            lines:
              type: array
              minItems: 2
              items: {"$ref": "#/components/schemas/JournalEntryLine"}

    JournalEntryPage:
      type: object
      required: ["data", "meta", "links"]
      properties:
        data:
          type: array
          items: {"$ref": "#/components/schemas/JournalEntry"}
        meta: {"$ref": "#/components/schemas/PageMeta"}
        links: {"$ref": "#/components/schemas/PageLinks"}

    JournalEntryRequest:
      type: object
      required: ["accounting_date", "lines"]
      additionalProperties: false
      properties:
        accounting_date: {"$ref": "#/components/schemas/AccountingDate"}
        narration: {"type": "string", "maxLength": 500}
        lines:
          type: array
          minItems: 2
          maxItems: 500
          items:
            type: object
            required: ["account_code", "amount"]
            additionalProperties: false
            properties:
              account_code:
                type: string
                description: |
                  The account's code, not its id - a code is what an
                  integration's own chart mapping is keyed on, and it is
                  stable across a restore.
              amount:
                type: string
                pattern: '^-?\d{1,17}(\.\d{1,4})?$'
                description: |
                  A **string**, and the validator refuses a number. `numeric`
                  would accept the JSON number 1.234, which PHP has already
                  turned into a float by the time any rule sees it - so the
                  precision is gone before validation runs and no later check
                  can recover it.

                  Signed: debits positive, credits negative. Must not be zero,
                  and the lines must sum to zero in the functional currency.
              currency:
                allOf: [{"$ref": "#/components/schemas/CurrencyCode"}]
                description: |
                  Defaults to the functional currency. A foreign line needs a
                  rate for the date, and one will not be invented.
              narration: {"type": "string", "maxLength": 500}
              dimensions:
                type: object
                additionalProperties: {"$ref": "#/components/schemas/Ulid"}

    ApiTokenResource:
      type: object
      required: ["resource", "id", "name", "plane", "scopes", "entity_ids"]
      properties:
        resource: {"type": "string", "const": "api_token"}
        id: {"$ref": "#/components/schemas/Ulid"}
        name: {"type": "string", "maxLength": 64}
        plane:
          type: string
          enum: ["tenant", "platform"]
          description: |
            Which plane issued it, written on the row. A platform token can
            never act on a tenant route and the check reads this column, not
            the model class - "they are in different databases" is true until
            somebody restores a dump into the wrong one.
        scopes:
          type: array
          minItems: 1
          items: {"type": "string"}
          description: Permission keys, verbatim. Never `*`.
        entity_ids:
          type: array
          minItems: 1
          items: {"$ref": "#/components/schemas/Ulid"}
        created_at: {"$ref": "#/components/schemas/Timestamp"}
        last_used_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
          description: |
            The field that answers the only question asked about a token found
            in a configuration file: is anything still using this.
        expires_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
        revoked_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
        revoked_reason: {"type": ["string", "null"]}
        rotated_to_token_id:
          type: ["string", "null"]
          description: The successor, when this row was rotated rather than simply revoked.

    ApiTokenIssued:
      allOf:
        - {"$ref": "#/components/schemas/ApiTokenResource"}
        - type: object
          required: ["token"]
          properties:
            token:
              type: string
              description: |
                The plaintext, returned **once**. There is no endpoint that
                returns it again: the whole value of storing a hash is that
                reading the table lets nobody act as anybody.
            issued_at: {"$ref": "#/components/schemas/Timestamp"}

    ApiTokenPage:
      type: object
      required: ["data", "meta"]
      properties:
        data:
          type: array
          items: {"$ref": "#/components/schemas/ApiTokenResource"}
        meta:
          type: object
          required: ["available_scopes"]
          properties:
            available_scopes:
              type: array
              items: {"type": "string"}
              description: |
                Every permission key, which is every scope. Published here so
                an integration never keeps its own copy - a copy is what goes
                stale when a deployment adds a permission.
            scopes_requiring_a_person_present:
              type: array
              items: {"type": "string"}
              description: |
                Permissions that can never be token scopes. A step-up
                assertion proves somebody is at the keyboard now; a token in a
                configuration file proves the opposite.

    ApiTokenRequest:
      type: object
      required: ["name", "scopes", "entity_ids"]
      additionalProperties: false
      properties:
        name: {"type": "string", "maxLength": 64}
        scopes:
          type: array
          minItems: 1
          items: {"type": "string"}
        entity_ids:
          type: array
          minItems: 1
          items: {"$ref": "#/components/schemas/Ulid"}
        expires_on:
          allOf: [{"$ref": "#/components/schemas/AccountingDate"}]
          description: |
            A date, not a timestamp. An expiry a customer asked for as "the end
            of March" is a day, and accepting a timestamp invites a timezone
            argument about which hour a credential dies in. It expires at the
            end of the day named.

    TokenReason:
      type: object
      required: ["reason"]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 200
          description: |
            Why. "Revoked" with no reason cannot distinguish a routine rotation
            from a response to a leak, and those are the two cases somebody
            will later need to tell apart. A database constraint requires it
            too.

    SignInRequest:
      type: object
      required: ["workspace", "email", "password", "device_name"]
      additionalProperties: false
      properties:
        workspace:
          type: string
          maxLength: 64
          description: The workspace the person types - its short name, as on the browser's sign-in form.
        email: {"type": "string", "format": "email", "maxLength": 255}
        password: {"type": "string", "maxLength": 1024}
        device_name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            What the person will recognise the device by in their list of
            signed-in devices - "Layla's iPhone", not a hardware identifier.
        entity_id:
          allOf: [{"$ref": "#/components/schemas/Ulid"}]
          description: |
            The company to open the session in. Optional: without it, the
            first company - by code - in which the person holds anything.

    SecondFactorRequest:
      type: object
      required: ["workspace", "challenge", "code"]
      additionalProperties: false
      properties:
        workspace: {"type": "string", "maxLength": 64}
        challenge:
          type: string
          pattern: '^pfch_'
          maxLength: 4096
          description: Exactly as the password stage returned it.
        code:
          type: string
          maxLength: 64
          description: Six digits from the authenticator app, or one unused recovery code.

    RefreshRequest:
      type: object
      required: ["refresh_token"]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          pattern: '^pfrt_'
          maxLength: 200
        entity_id:
          allOf: [{"$ref": "#/components/schemas/Ulid"}]
          description: Switch company. Omit to continue where the session was.

    SecondFactorChallenge:
      type: object
      required: ["resource", "challenge", "expires_at", "accepts"]
      additionalProperties: false
      properties:
        resource: {"type": "string", "const": "second_factor_challenge"}
        challenge:
          type: string
          pattern: '^pfch_'
          description: |
            Opaque and encrypted. Send it back unaltered with the code; it
            names an account, so it reveals nothing to anybody without the
            application's key.
        expires_at: {"$ref": "#/components/schemas/Timestamp"}
        accepts:
          type: array
          items: {"type": "string", "enum": ["totp", "recovery_code"]}

    EntitySummary:
      type: object
      required: ["id", "code", "legal_name", "functional_currency"]
      additionalProperties: false
      properties:
        id: {"$ref": "#/components/schemas/Ulid"}
        code: {"type": "string"}
        legal_name: {"type": "string"}
        functional_currency: {"$ref": "#/components/schemas/CurrencyCode"}

    Me:
      type: object
      required: ["resource", "id", "name", "email", "locale", "second_factor_enrolled", "entity_id", "scopes", "entities"]
      additionalProperties: false
      properties:
        resource: {"type": "string", "const": "me"}
        id: {"$ref": "#/components/schemas/Ulid"}
        name: {"type": "string"}
        email: {"type": "string", "format": "email"}
        locale: {"type": ["string", "null"]}
        second_factor_enrolled: {"type": "boolean"}
        entity_id:
          allOf: [{"$ref": "#/components/schemas/Ulid"}]
          description: The company this token acts in.
        scopes:
          type: array
          items: {"type": "string"}
          description: |
            What THIS token may do in `entity_id` - permission keys, verbatim.
            Show an action only when its permission is here.
        entities:
          type: array
          items: {"$ref": "#/components/schemas/EntitySummary"}
          description: Every company the person may switch to, by code.

    DeviceSession:
      type: object
      required: ["resource", "id", "token_type", "access_token", "access_token_expires_at", "refresh_token", "refresh_token_expires_at", "session_started_at", "second_factor", "tenant", "entity_id", "me"]
      additionalProperties: false
      description: |
        Both credentials, **returned once**. The database holds hashes of
        both, so there is no endpoint that returns either again.

        Keep the refresh token in the platform's secure storage - the iOS
        Keychain, Android's Keystore - and never in plain preferences.
      properties:
        resource: {"type": "string", "const": "device_session"}
        id:
          allOf: [{"$ref": "#/components/schemas/Ulid"}]
          description: The session. The same id for every refresh in it.
        token_type: {"type": "string", "const": "Bearer"}
        access_token:
          type: string
          description: Sent as `Authorization: Bearer <access_token>` on every request. Lives an hour.
        access_token_expires_at: {"$ref": "#/components/schemas/Timestamp"}
        refresh_token:
          type: string
          pattern: '^pfrt_'
          description: |
            Exchanged for the next pair at `POST /auth/refresh`, **once**. A
            second use closes the session.
        refresh_token_expires_at: {"$ref": "#/components/schemas/Timestamp"}
        session_started_at:
          allOf: [{"$ref": "#/components/schemas/Timestamp"}]
          description: The session ends 90 days after this, however often it is refreshed.
        second_factor:
          type: ["string", "null"]
          description: What the person presented when the session began - `totp`, `recovery_code`, or null for none.
        tenant:
          type: object
          required: ["id", "slug", "name"]
          additionalProperties: false
          description: The workspace. Send `id` as `X-Tenant` from now on.
          properties:
            id: {"$ref": "#/components/schemas/Ulid"}
            slug: {"type": "string"}
            name: {"type": "string"}
        entity_id:
          allOf: [{"$ref": "#/components/schemas/Ulid"}]
          description: The company the access token acts in. Send it as `X-Entity`.
        me: {"$ref": "#/components/schemas/Me"}

    DeviceSessionSummary:
      type: object
      required: ["resource", "id", "device_name", "entity_id", "second_factor", "started_at", "last_refreshed_at", "expires_at", "revoked_at", "current"]
      additionalProperties: false
      properties:
        resource: {"type": "string", "const": "device_session_summary"}
        id: {"$ref": "#/components/schemas/Ulid"}
        device_name: {"type": "string"}
        entity_id: {"$ref": "#/components/schemas/Ulid"}
        second_factor: {"type": ["string", "null"]}
        started_at: {"$ref": "#/components/schemas/Timestamp"}
        last_refreshed_at: {"$ref": "#/components/schemas/Timestamp"}
        expires_at: {"$ref": "#/components/schemas/Timestamp"}
        revoked_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
        current:
          type: boolean
          description: True for the session this request came from.

    DeviceSessionList:
      type: object
      required: ["data"]
      additionalProperties: false
      properties:
        data:
          type: array
          items: {"$ref": "#/components/schemas/DeviceSessionSummary"}

    SignOutResult:
      type: object
      required: ["resource", "session_id", "token_id", "signed_out_at"]
      additionalProperties: false
      properties:
        resource: {"type": "string", "const": "sign_out"}
        session_id:
          type: ["string", "null"]
          description: The session closed, or null when the token was not part of one and was revoked on its own.
        token_id: {"$ref": "#/components/schemas/Ulid"}
        signed_out_at: {"$ref": "#/components/schemas/Timestamp"}

    AgeingBucket:
      type: object
      required: ["bucket", "amount"]
      additionalProperties: false
      properties:
        bucket:
          type: string
          enum: ["current", "1-30", "31-60", "61-90", "90+"]
          description: Days past due. `current` is not due yet.
        amount: {"$ref": "#/components/schemas/Money"}

    Overview:
      type: object
      required: ["resource", "entity_id", "currency", "as_of", "cash", "receivables", "payables", "reconciliation", "drafts", "tax", "activity"]
      additionalProperties: false
      properties:
        resource: {"type": "string", "const": "overview"}
        entity_id: {"$ref": "#/components/schemas/Ulid"}
        currency:
          allOf: [{"$ref": "#/components/schemas/CurrencyCode"}]
          description: The functional currency. Every amount below is in it.
        as_of: {"$ref": "#/components/schemas/AccountingDate"}
        cash:
          type: object
          required: ["balance", "balance_then", "days", "change_percent", "direction", "has_activity", "series"]
          additionalProperties: false
          properties:
            balance: {"$ref": "#/components/schemas/Money"}
            balance_then:
              oneOf: [{"$ref": "#/components/schemas/Money"}, {"type": "null"}]
              description: The balance `days` ago, for the trend; null with no history that far back.
            days: {"type": "integer"}
            change_percent:
              type: ["string", "null"]
              description: A decimal string, one place - a ratio, not money, and a string for the same reason.
            direction: {"type": "string", "enum": ["up", "down", "flat"]}
            has_activity: {"type": "boolean"}
            series:
              type: array
              description: The closing balance per day, oldest first, ending `as_of`.
              items:
                type: object
                required: ["date", "balance"]
                additionalProperties: false
                properties:
                  date: {"$ref": "#/components/schemas/AccountingDate"}
                  balance: {"$ref": "#/components/schemas/Money"}
        receivables:
          type: object
          required: ["total", "overdue", "documents", "other_currency_documents", "buckets"]
          additionalProperties: false
          properties:
            total: {"$ref": "#/components/schemas/Money"}
            overdue: {"$ref": "#/components/schemas/Money"}
            documents: {"type": "integer"}
            other_currency_documents:
              type: integer
              description: Open invoices in another currency, counted and not converted.
            buckets:
              type: array
              items: {"$ref": "#/components/schemas/AgeingBucket"}
        payables:
          type: object
          required: ["total", "overdue", "due_this_week", "documents", "due_this_week_documents", "other_currency_documents"]
          additionalProperties: false
          properties:
            total: {"$ref": "#/components/schemas/Money"}
            overdue: {"$ref": "#/components/schemas/Money"}
            due_this_week: {"$ref": "#/components/schemas/Money"}
            documents: {"type": "integer"}
            due_this_week_documents: {"type": "integer"}
            other_currency_documents: {"type": "integer"}
        reconciliation:
          type: object
          required: ["matched", "suggested", "waiting", "days", "percent_matched"]
          additionalProperties: false
          properties:
            matched: {"type": "integer"}
            suggested: {"type": "integer"}
            waiting: {"type": "integer"}
            days: {"type": "integer"}
            percent_matched: {"type": "integer"}
        drafts:
          type: object
          required: ["invoices", "bills", "journals"]
          additionalProperties: false
          properties:
            invoices: {"type": "integer"}
            bills: {"type": "integer"}
            journals: {"type": "integer"}
        tax:
          description: The next tax return due, or null when there is none to file.
          oneOf:
            - {"type": "null"}
            - type: object
              required: ["label", "due_on", "overdue", "days_left"]
              additionalProperties: false
              properties:
                label: {"type": "string"}
                due_on:
                  oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
                overdue: {"type": "boolean"}
                days_left: {"type": ["integer", "null"]}
        activity:
          type: array
          description: The latest entries in the audit log for this company, newest first.
          items:
            type: object
            required: ["actor", "action", "subject", "at"]
            additionalProperties: false
            properties:
              actor: {"type": "string"}
              action: {"type": "string"}
              subject: {"type": ["string", "null"]}
              at: {"$ref": "#/components/schemas/Timestamp"}

    DecimalString:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: |
        An exact decimal that is not money - a quantity, a unit price at eight
        places, a tax rate. A string for the reason money is one.
      examples: ["1.00000000", "15.000000"]

    NullableMoney:
      oneOf: [{"$ref": "#/components/schemas/Money"}, {"type": "null"}]

    Counterparty:
      type: object
      required: ["id", "name"]
      additionalProperties: false
      properties:
        id: {"$ref": "#/components/schemas/Ulid"}
        name:
          type: string
          description: As frozen on the document when it was issued - renaming the party does not rewrite it.

    TaxBreakdownRow:
      type: object
      required: ["category", "rate", "taxable", "tax"]
      properties:
        category: {"type": "string"}
        rate: {"$ref": "#/components/schemas/DecimalString"}
        taxable: {"$ref": "#/components/schemas/NullableMoney"}
        tax: {"$ref": "#/components/schemas/NullableMoney"}
        recoverable: {"$ref": "#/components/schemas/NullableMoney"}
        reverse_charge: {"type": "boolean"}
        exemption_reason_code: {"type": ["string", "null"]}
        exemption_reason: {"type": ["string", "null"]}

    DocumentLine:
      type: object
      required: ["line_no", "description", "quantity", "unit_price", "net"]
      properties:
        line_no: {"type": "integer"}
        item_code: {"type": ["string", "null"]}
        description: {"type": "string"}
        quantity: {"$ref": "#/components/schemas/DecimalString"}
        unit_code: {"type": ["string", "null"]}
        unit_price: {"$ref": "#/components/schemas/DecimalString"}
        net: {"$ref": "#/components/schemas/NullableMoney"}
        tax_category: {"type": ["string", "null"]}
        tax_rate:
          oneOf: [{"$ref": "#/components/schemas/DecimalString"}, {"type": "null"}]
        tax: {"$ref": "#/components/schemas/NullableMoney"}
        recoverable_percent: {"type": ["string", "null"]}
        reverse_charge: {"type": "boolean"}

    InvoiceSummary:
      type: object
      required: ["resource", "id", "number", "status", "document_type", "issue_date", "due_on", "customer", "currency", "net", "tax", "gross", "payable", "open_balance", "issued_at"]
      properties:
        resource: {"type": "string", "const": "invoice"}
        id: {"$ref": "#/components/schemas/Ulid"}
        number:
          type: ["string", "null"]
          description: Null on a draft - a number is assigned when the invoice is issued, never before.
        status: {"type": "string", "enum": ["draft", "issued"]}
        document_type:
          type: string
          description: UNTDID 1001 - 380 invoice, 381 credit note, 383 debit note, and so on.
        issue_date: {"$ref": "#/components/schemas/AccountingDate"}
        due_on:
          oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
          description: The latest due date in the payment terms frozen on the invoice.
        customer: {"$ref": "#/components/schemas/Counterparty"}
        currency: {"$ref": "#/components/schemas/CurrencyCode"}
        net: {"$ref": "#/components/schemas/NullableMoney"}
        tax: {"$ref": "#/components/schemas/NullableMoney"}
        gross: {"$ref": "#/components/schemas/NullableMoney"}
        payable: {"$ref": "#/components/schemas/NullableMoney"}
        open_balance:
          allOf: [{"$ref": "#/components/schemas/NullableMoney"}]
          description: The database's own answer to "what is still owed", never computed by the client.
        issued_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]

    InvoiceDetail:
      allOf:
        - {"$ref": "#/components/schemas/InvoiceSummary"}
        - type: object
          required: ["delivery_date", "prepaid", "lines", "tax_breakdown", "payments"]
          properties:
            delivery_date:
              oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
            prepaid: {"$ref": "#/components/schemas/NullableMoney"}
            lines:
              type: array
              items: {"$ref": "#/components/schemas/DocumentLine"}
            tax_breakdown:
              type: array
              items: {"$ref": "#/components/schemas/TaxBreakdownRow"}
            payments:
              type: array
              description: The payments applied to this invoice, oldest first. A reversed one keeps its row and gains `reversed_at`.
              items:
                type: object
                required: ["payment_number", "value_date", "allocated_on", "amount", "reversed_at"]
                properties:
                  payment_number: {"type": ["string", "null"]}
                  value_date:
                    oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
                  allocated_on:
                    oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
                  amount: {"$ref": "#/components/schemas/NullableMoney"}
                  reversed_at:
                    oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]

    InvoicePage:
      type: object
      required: ["data", "meta", "links"]
      properties:
        data:
          type: array
          items: {"$ref": "#/components/schemas/InvoiceSummary"}
        meta: {"$ref": "#/components/schemas/PageMeta"}
        links: {"$ref": "#/components/schemas/PageLinks"}

    BillSummary:
      type: object
      required: ["resource", "id", "status", "document_type", "supplier_document_number", "supplier_document_date", "posting_date", "due_on", "supplier", "currency", "net", "tax", "gross", "payable", "open_balance", "approved_at", "posted_at"]
      properties:
        resource: {"type": "string", "const": "bill"}
        id: {"$ref": "#/components/schemas/Ulid"}
        status: {"type": "string", "enum": ["draft", "awaiting_approval", "approved", "posted", "cancelled"]}
        document_type: {"type": "string"}
        supplier_document_number: {"type": "string"}
        supplier_document_date: {"$ref": "#/components/schemas/AccountingDate"}
        posting_date: {"$ref": "#/components/schemas/AccountingDate"}
        due_on:
          oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
          description: The latest due date in the payment terms, or the supplier's document date when there are none.
        supplier: {"$ref": "#/components/schemas/Counterparty"}
        currency: {"$ref": "#/components/schemas/CurrencyCode"}
        net: {"$ref": "#/components/schemas/NullableMoney"}
        tax: {"$ref": "#/components/schemas/NullableMoney"}
        gross: {"$ref": "#/components/schemas/NullableMoney"}
        payable: {"$ref": "#/components/schemas/NullableMoney"}
        open_balance: {"$ref": "#/components/schemas/NullableMoney"}
        approved_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
        posted_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]

    BillDetail:
      allOf:
        - {"$ref": "#/components/schemas/BillSummary"}
        - type: object
          required: ["tax_point", "recoverable_tax", "non_recoverable_tax", "lines", "tax_breakdown"]
          properties:
            tax_point:
              oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
            recoverable_tax: {"$ref": "#/components/schemas/NullableMoney"}
            non_recoverable_tax: {"$ref": "#/components/schemas/NullableMoney"}
            approval:
              description: The bill's most recent approval chain, or null when it was never submitted.
              oneOf: [{"$ref": "#/components/schemas/BillApproval"}, {"type": "null"}]
            lines:
              type: array
              items: {"$ref": "#/components/schemas/DocumentLine"}
            tax_breakdown:
              type: array
              items: {"$ref": "#/components/schemas/TaxBreakdownRow"}

    BillApproval:
      type: object
      required: ["id", "status", "requested_by", "requested_at", "decided_at", "outcome", "who_can_decide", "steps", "decisions"]
      additionalProperties: false
      properties:
        id: {"$ref": "#/components/schemas/Ulid"}
        status:
          type: string
          enum: ["pending", "approved", "rejected", "cancelled", "stale"]
          description: "`stale` - the bill changed under the chain, which restarts from the beginning."
        requested_by: {"type": ["string", "null"]}
        requested_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
        decided_at:
          oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
        outcome: {"type": ["string", "null"]}
        who_can_decide:
          type: ["string", "null"]
          description: Who can clear the open step - the engine's own sentence. Null once the chain is decided.
        steps:
          type: array
          items:
            type: object
            required: ["sequence", "role", "user_id", "quorum", "approvals", "status"]
            additionalProperties: false
            properties:
              sequence: {"type": "integer"}
              role: {"type": ["string", "null"]}
              user_id: {"type": ["string", "null"]}
              quorum: {"type": "integer"}
              approvals: {"type": "integer"}
              status: {"type": "string"}
        decisions:
          type: array
          items:
            type: object
            required: ["user_id", "name", "decision", "comment", "decided_at"]
            additionalProperties: false
            properties:
              user_id: {"$ref": "#/components/schemas/Ulid"}
              name: {"type": ["string", "null"]}
              decision: {"type": "string", "enum": ["approved", "rejected"]}
              comment: {"type": ["string", "null"]}
              decided_at:
                oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]

    ApprovalComment:
      type: object
      additionalProperties: false
      properties:
        comment: {"type": "string", "maxLength": 500}

    RejectionReason:
      type: object
      required: ["comment"]
      additionalProperties: false
      properties:
        comment:
          type: string
          minLength: 5
          maxLength: 500
          description: What to change. A rejection that does not say returns the bill to somebody with no idea.

    BillPage:
      type: object
      required: ["data", "meta", "links"]
      properties:
        data:
          type: array
          items: {"$ref": "#/components/schemas/BillSummary"}
        meta: {"$ref": "#/components/schemas/PageMeta"}
        links: {"$ref": "#/components/schemas/PageLinks"}

    Party:
      type: object
      required: ["resource", "id", "code", "legal_name", "trading_name", "is_customer", "is_supplier", "is_employee", "country", "default_currency", "active"]
      properties:
        resource: {"type": "string", "const": "party"}
        id: {"$ref": "#/components/schemas/Ulid"}
        code: {"type": ["string", "null"]}
        legal_name: {"type": "string"}
        trading_name: {"type": ["string", "null"]}
        is_customer: {"type": "boolean"}
        is_supplier: {"type": "boolean"}
        is_employee: {"type": "boolean"}
        country: {"type": ["string", "null"]}
        default_currency: {"type": ["string", "null"]}
        active: {"type": "boolean"}

    PartyDetail:
      allOf:
        - {"$ref": "#/components/schemas/Party"}
        - type: object
          required: ["credit", "bank_accounts", "open_documents"]
          properties:
            credit:
              type: object
              required: ["limit", "on_hold", "hold_reason", "held_at"]
              additionalProperties: false
              description: This company's credit position with the party.
              properties:
                limit: {"$ref": "#/components/schemas/NullableMoney"}
                on_hold: {"type": "boolean"}
                hold_reason: {"type": ["string", "null"]}
                held_at:
                  oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
            bank_accounts:
              type: array
              items:
                type: object
                required: ["id", "masked", "active", "requires_reverification"]
                additionalProperties: false
                description: The last four digits only - never the account number.
                properties:
                  id: {"$ref": "#/components/schemas/Ulid"}
                  label: {"type": ["string", "null"]}
                  bank_name: {"type": ["string", "null"]}
                  country: {"type": ["string", "null"]}
                  currency: {"type": ["string", "null"]}
                  masked: {"type": "string"}
                  active: {"type": "boolean"}
                  requires_reverification: {"type": "boolean"}
                  verified_at:
                    oneOf: [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]
            open_documents:
              type: array
              description: Issued invoices and approved bills with this party that are not settled, in this company.
              items:
                type: object
                required: ["kind", "id", "reference", "document_date", "gross", "open_balance"]
                additionalProperties: false
                properties:
                  kind: {"type": "string", "enum": ["invoice", "bill"]}
                  id: {"$ref": "#/components/schemas/Ulid"}
                  reference: {"type": "string"}
                  document_date:
                    oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
                  gross: {"$ref": "#/components/schemas/NullableMoney"}
                  open_balance: {"$ref": "#/components/schemas/NullableMoney"}

    PartyPage:
      type: object
      required: ["data", "meta", "links"]
      properties:
        data:
          type: array
          items: {"$ref": "#/components/schemas/Party"}
        meta: {"$ref": "#/components/schemas/PageMeta"}
        links: {"$ref": "#/components/schemas/PageLinks"}

    BankAccountList:
      type: object
      required: ["data"]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            type: object
            required: ["resource", "id", "label", "status", "currency", "masked", "as_of", "ledger", "statement", "available", "reconciliation"]
            additionalProperties: false
            properties:
              resource: {"type": "string", "const": "bank_account"}
              id: {"$ref": "#/components/schemas/Ulid"}
              label: {"type": "string"}
              status: {"type": "string", "enum": ["active", "dormant", "closed"]}
              institution_name: {"type": ["string", "null"]}
              institution_country: {"type": ["string", "null"]}
              currency: {"$ref": "#/components/schemas/CurrencyCode"}
              masked: {"type": ["string", "null"]}
              as_of:
                oneOf: [{"$ref": "#/components/schemas/AccountingDate"}, {"type": "null"}]
              ledger: {"$ref": "#/components/schemas/NullableMoney"}
              statement: {"$ref": "#/components/schemas/NullableMoney"}
              available: {"$ref": "#/components/schemas/NullableMoney"}
              reconciliation:
                type: object
                required: ["agrees", "difference", "why"]
                additionalProperties: false
                properties:
                  agrees: {"type": "boolean"}
                  difference: {"$ref": "#/components/schemas/NullableMoney"}
                  why: {"type": ["string", "null"]}

    ReportPeriodRef:
      type: object
      required: ["id", "label", "starts_on", "ends_on"]
      additionalProperties: false
      properties:
        id: {"$ref": "#/components/schemas/Ulid"}
        label: {"type": "string"}
        starts_on: {"$ref": "#/components/schemas/AccountingDate"}
        ends_on: {"$ref": "#/components/schemas/AccountingDate"}

    PeriodList:
      type: object
      required: ["data"]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            type: object
            required: ["resource", "id", "label", "starts_on", "ends_on", "state", "has_postings"]
            additionalProperties: false
            properties:
              resource: {"type": "string", "const": "period"}
              id: {"$ref": "#/components/schemas/Ulid"}
              label: {"type": "string"}
              starts_on: {"$ref": "#/components/schemas/AccountingDate"}
              ends_on: {"$ref": "#/components/schemas/AccountingDate"}
              state: {"type": "string"}
              has_postings: {"type": "boolean"}

    ReportResponse:
      type: object
      required: ["resource", "entity_id", "currency", "period", "comparative_period", "report"]
      additionalProperties: false
      description: |
        A financial statement. `report` is the statement exactly as the
        browser's page receives it from the reporting service - its rows,
        bands or sections - with **every amount converted to Money**: the
        members `opening`, `movement`, `closing`, `amount`, `comparative`,
        `subtotal`, `total` and the statement totals. Labels come in both
        languages (`label_ar`, `label_en`), and `declaration` carries the
        statement's own verdict on itself in both.
      properties:
        resource: {"type": "string", "enum": ["trial_balance", "profit_or_loss", "financial_position"]}
        entity_id: {"$ref": "#/components/schemas/Ulid"}
        currency: {"$ref": "#/components/schemas/CurrencyCode"}
        period: {"$ref": "#/components/schemas/ReportPeriodRef"}
        comparative_period:
          oneOf: [{"$ref": "#/components/schemas/ReportPeriodRef"}, {"type": "null"}]
        report:
          type: object
          description: The statement - see above.

    PositiveAmount:
      type: string
      pattern: '^\d{1,17}(\.\d{1,4})?$'
      description: A positive decimal string, at most four places. Never a JSON number.

    PaymentRequest:
      type: object
      required: ["direction", "method", "amount", "currency", "value_date"]
      additionalProperties: false
      properties:
        direction: {"type": "string", "enum": ["receipt", "disbursement"]}
        method:
          type: string
          enum: ["1", "10", "20", "30", "42", "48", "49", "58", "59", "68", "97"]
          description: |
            UNTDID 4461 - `30` credit transfer, `10` cash, `20` cheque, `48`
            card, `49` direct debit. Every method but cash and clearing moves
            through a bank, and so needs `bank_account_id`.
        amount: {"$ref": "#/components/schemas/PositiveAmount"}
        currency: {"$ref": "#/components/schemas/CurrencyCode"}
        value_date: {"$ref": "#/components/schemas/AccountingDate"}
        bank_account_id:
          allOf: [{"$ref": "#/components/schemas/Ulid"}]
          description: One of the company's bank accounts, in the payment's currency. Exactly one of this and `cash_account_id`.
        cash_account_id:
          allOf: [{"$ref": "#/components/schemas/Ulid"}]
          description: A cash account in the chart, in the functional currency.
        party_id: {"$ref": "#/components/schemas/Ulid"}
        reference:
          type: string
          maxLength: 140
          description: The bank's or the payer's reference, for reconciliation.
        note: {"type": "string", "maxLength": 500}
        allocations:
          type: array
          maxItems: 100
          items:
            type: object
            required: ["document_type", "document_id", "amount"]
            additionalProperties: false
            properties:
              document_type: {"type": "string", "enum": ["invoice", "bill"]}
              document_id: {"$ref": "#/components/schemas/Ulid"}
              amount: {"$ref": "#/components/schemas/PositiveAmount"}

    Payment:
      type: object
      required: ["resource", "id", "number", "direction", "method", "amount", "value_date", "journal_entry_id", "allocations", "unallocated"]
      additionalProperties: false
      properties:
        resource: {"type": "string", "const": "payment"}
        id: {"$ref": "#/components/schemas/Ulid"}
        number: {"type": ["string", "null"]}
        direction: {"type": "string", "enum": ["receipt", "disbursement"]}
        method: {"type": "string"}
        amount: {"$ref": "#/components/schemas/Money"}
        value_date: {"$ref": "#/components/schemas/AccountingDate"}
        bank_account_id: {"type": ["string", "null"]}
        party_id: {"type": ["string", "null"]}
        journal_entry_id:
          type: ["string", "null"]
          description: The entry that put the money in unapplied cash.
        allocations:
          type: array
          items:
            type: object
            required: ["id", "document_type", "document_id", "amount"]
            additionalProperties: false
            properties:
              id: {"type": ["string", "null"]}
              document_type: {"type": "string", "enum": ["invoice", "bill"]}
              document_id: {"$ref": "#/components/schemas/Ulid"}
              amount: {"$ref": "#/components/schemas/Money"}
        unallocated:
          allOf: [{"$ref": "#/components/schemas/Money"}]
          description: What is left in unapplied cash, waiting for a document to claim it.
