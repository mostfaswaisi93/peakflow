  /bills/{id}/submit:
    post:
      tags: ["Purchasing"]
      operationId: submitBill
      summary: Submit a draft bill for approval
      description: |
        Opens the approval chain. The chain is compiled from the company's
        approval rules **once and written down** - a rule changed later does
        not move the goalposts under people already in it - and a bill no rule
        covers is refused (422) rather than treated as approved.

        Only a draft can be submitted (409 otherwise). Needs `bill.create`.
        Returns the bill, with `approval` showing the chain and who can clear
        its open step.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/ResourceId"}
      responses:
        '200':
          description: The bill, awaiting approval
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/BillDetail"}
              examples:
                awaiting:
                  summary: Waiting for the controller
                  value: {"resource": "bill", "id": "01jd3xq7f8k2m9n4p5r6s7t8vc", "status": "awaiting_approval", "document_type": "380", "supplier_document_number": "SUP-DRAFT-001", "supplier_document_date": "2026-11-18", "posting_date": "2026-11-18", "due_on": "2026-12-18", "supplier": {"id": "01jd3xq7f8k2m9n4p5r6s7t8vd", "name": "Sahaba Technology"}, "currency": "SAR", "net": {"amount": "2860.0000", "currency": "SAR", "presentation_exponent": 2}, "tax": {"amount": "429.0000", "currency": "SAR", "presentation_exponent": 2}, "gross": {"amount": "3289.0000", "currency": "SAR", "presentation_exponent": 2}, "payable": {"amount": "3289.0000", "currency": "SAR", "presentation_exponent": 2}, "open_balance": {"amount": "3289.0000", "currency": "SAR", "presentation_exponent": 2}, "approved_at": null, "posted_at": null, "tax_point": "2026-11-18", "recoverable_tax": {"amount": "429.0000", "currency": "SAR", "presentation_exponent": 2}, "non_recoverable_tax": {"amount": "0.0000", "currency": "SAR", "presentation_exponent": 2}, "lines": [], "tax_breakdown": [], "approval": {"id": "01jd3xq7f8k2m9n4p5r6s7t8vn", "status": "pending", "requested_by": "01jd3xq7f8k2m9n4p5r6s7t8vp", "requested_at": "2026-11-19T11:30:02Z", "decided_at": null, "outcome": null, "who_can_decide": "anyone with the controller role", "steps": [{"sequence": 1, "role": "controller", "user_id": null, "quorum": 1, "approvals": 0, "status": "open"}], "decisions": []}}
        '400': {"$ref": "#/components/responses/BadRequest"}
