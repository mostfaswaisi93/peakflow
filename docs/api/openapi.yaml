                  value: {"resource": "payment", "id": "01jd3xq7f8k2m9n4p5r6s7t8vj", "number": "PAY-2026/00035", "direction": "receipt", "method": "30", "amount": {"amount": "4830.0000", "currency": "SAR", "presentation_exponent": 2}, "value_date": "2026-11-19", "bank_account_id": "01jd3xq7f8k2m9n4p5r6s7t8vf", "party_id": "01jd3xq7f8k2m9n4p5r6s7t8vb", "journal_entry_id": "01jd3xq7f8k2m9n4p5r6s7t8vk", "allocations": [{"id": "01jd3xq7f8k2m9n4p5r6s7t8vm", "document_type": "invoice", "document_id": "01jd3xq7f8k2m9n4p5r6s7t8va", "amount": {"amount": "4830.0000", "currency": "SAR", "presentation_exponent": 2}}], "unallocated": {"amount": "0.0000", "currency": "SAR", "presentation_exponent": 2}}
