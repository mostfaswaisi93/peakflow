  /payments:
    post:
      tags: ["Banking"]
      operationId: recordPayment
      summary: Record a payment, and apply it to documents
      description: |
        Records money in (`receipt`) or out (`disbursement`) through a bank
        account or a cash account, and - optionally, in the same request -
        applies it to the invoices or bills it settles.

        **All or nothing.** The payment and its allocations are one
        transaction: if any allocation is refused, nothing is recorded. A
        payment recorded while its allocation was refused would sit in
        unapplied cash with the invoice still owed - two facts nobody intended.

        **It posts to the ledger, so `Idempotency-Key` is required.** A retried
        receipt without one is a second receipt.

        Each allocation must name a document this payment can settle: a
        receipt settles an **issued** sales invoice, a disbursement a
        **posted** bill, with the same party when `party_id` is given - and
        no more than is still open on it. Refusals are addressed by pointer.

        Needs `payment.record`, and `payment.allocate` as well when
        `allocations` is not empty.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/PaymentRequest"}
            examples:
              customerPaid:
                summary: A customer paid invoice 28 by bank transfer
                value: {"direction": "receipt", "method": "30", "amount": "4830.0000", "currency": "SAR", "value_date": "2026-11-19", "bank_account_id": "01jd3xq7f8k2m9n4p5r6s7t8vf", "party_id": "01jd3xq7f8k2m9n4p5r6s7t8vb", "reference": "TRF 88213", "allocations": [{"document_type": "invoice", "document_id": "01jd3xq7f8k2m9n4p5r6s7t8va", "amount": "4830.0000"}]}
      responses:
        '201':
          description: Recorded, and applied
          headers:
            Idempotent-Replay: {"$ref": "#/components/headers/IdempotentReplay"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Payment"}
              examples:
