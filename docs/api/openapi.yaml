        '500': {"$ref": "#/components/responses/ServerError"}

  /bills/{id}/approve:
    post:
      tags: ["Purchasing"]
      operationId: approveBill
      summary: Approve the open step - and, on the last, book the bill
      description: |
        Records this person's approval of the step they hold. While steps
        remain, the bill waits. **When the last step clears, the bill is
        approved and posted to the ledger in the same transaction** - so
        "approved" never means "approved, and somebody still has to book it".
        If the ledger refuses (an unacknowledged duplicate, an open
        three-way-match exception) the approval is refused with that reason
        and nothing is recorded; approve again once it is fixed.

        The engine holds the rest:
        - **The person who submitted cannot approve** (403
          `segregation-of-duties-conflict`), and the refusal names who can.
        - The approver must hold the open step's role, within their limit,
          tested on the functional amount (403 `forbidden`).
        - A bill that **changed** since it was submitted returns its chain
          to the start (412 `stale-write`) - the earlier approvers approved
          a different document.

        It can post to the ledger, so `Idempotency-Key` is required. Needs
        `bill.approve`.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/IdempotencyKey"}
        - {"$ref": "#/components/parameters/ResourceId"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/ApprovalComment"}
            examples:
              checked:
                summary: An approval with a note
                value: {"comment": "Checked against the purchase order."}
      responses:
        '200':
          description: The bill after the decision - posted, or still awaiting the next step
          headers:
            Idempotent-Replay: {"$ref": "#/components/headers/IdempotentReplay"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/BillDetail"}
              examples:
                posted:
                  summary: The last step cleared, and the bill is booked
                  value: {"resource": "bill", "id": "01jd3xq7f8k2m9n4p5r6s7t8vc", "status": "posted", "document_type": "380", "supplier_document_number": "SUP-DRAFT-001", "supplier_document_date": "2026-11-18", "posting_date": "2026-11-18", "due_on": "2026-12-18", "supplier": {"id": "01jd3xq7f8k2m9n4p5r6s7t8vd", "name": "Sahaba Technology"}, "currency": "SAR", "net": {"amount": "2860.0000", "currency": "SAR", "presentation_exponent": 2}, "tax": {"amount": "429.0000", "currency": "SAR", "presentation_exponent": 2}, "gross": {"amount": "3289.0000", "currency": "SAR", "presentation_exponent": 2}, "payable": {"amount": "3289.0000", "currency": "SAR", "presentation_exponent": 2}, "open_balance": {"amount": "3289.0000", "currency": "SAR", "presentation_exponent": 2}, "approved_at": "2026-11-19T11:32:46Z", "posted_at": "2026-11-19T11:32:46Z", "tax_point": "2026-11-18", "recoverable_tax": {"amount": "429.0000", "currency": "SAR", "presentation_exponent": 2}, "non_recoverable_tax": {"amount": "0.0000", "currency": "SAR", "presentation_exponent": 2}, "lines": [], "tax_breakdown": [], "approval": {"id": "01jd3xq7f8k2m9n4p5r6s7t8vn", "status": "approved", "requested_by": "01jd3xq7f8k2m9n4p5r6s7t8vp", "requested_at": "2026-11-19T11:30:02Z", "decided_at": "2026-11-19T11:32:46Z", "outcome": null, "who_can_decide": null, "steps": [{"sequence": 1, "role": "controller", "user_id": null, "quorum": 1, "approvals": 1, "status": "approved"}], "decisions": [{"user_id": "01jd3xq7f8k2m9n4p5r6s7t8vq", "name": "Demo Controller", "decision": "approved", "comment": "Checked against the purchase order.", "decided_at": "2026-11-19T11:32:46Z"}]}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '412': {"$ref": "#/components/responses/Stale"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '423': {"$ref": "#/components/responses/PeriodClosed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /bills/{id}/reject:
    post:
      tags: ["Purchasing"]
      operationId: rejectBill
      summary: Reject the bill back to draft
      description: |
        A rejection **needs a reason** (at least five characters) - one that
        is not returns the document to somebody with no idea what to change.
        The bill goes back to draft, to be corrected and submitted again,
        when its chain starts from the beginning. Books nothing, so no
        `Idempotency-Key`. Needs `bill.approve`.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
