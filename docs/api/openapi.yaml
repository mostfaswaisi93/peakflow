        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RejectionReason"}
            examples:
              quantity:
                summary: Sent back with what to fix
                value: {"comment": "The quantity on line 1 does not match the delivery note."}
      responses:
        '200':
          description: The bill, back in draft, with the rejection on its chain
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
