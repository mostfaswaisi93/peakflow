openapi: 3.1.0

# =============================================================================
#  THE CONTRACT. Written before the route, and reviewed as part of any API
#  change - PF-217.
# =============================================================================
#
#  An operation appears in this document when its route EXISTS. That is not a
#  bookkeeping preference: tests/Support/ApiContractRules.php asserts the
#  agreement in both directions, so an operation here with no route fails the
#  build, and so does a route with no operation. An API that documented
#  endpoints returning 404 would be worse than one documenting fewer - a
#  client writes code against the document.
#
#  The resource surface therefore arrives with the tasks that implement it.
#  Phase 12 brings the plumbing: the contract, authentication and scopes,
#  problem details, idempotency, pagination, and money and dates on the wire.
#  Invoices, payments, payment runs, statement import and the reports arrive
#  with their own tasks, each adding its operations here in the same pull
#  request.
#
# -----------------------------------------------------------------------------
#  An authoring convention, and the reason for it
# -----------------------------------------------------------------------------
#
#  Inline mappings and sequences in this file are written as JSON - YAML
#  accepts JSON, so `{"$ref": "#/components/schemas/Money"}` is valid YAML -
#  and every example is strict JSON.
#
#  This project has no YAML library: none could be installed in the
#  environment it was first assembled in, which is the same reason bin/verify
#  exists. The contract test therefore reads this document with a parser of
#  its own, and a parser small enough to be trusted is one that handles block
#  structure plus JSON. It REFUSES anything else rather than guessing, so the
#  document cannot drift into syntax the check silently skips - which would be
#  a check that cannot fail.
#
#  The cost is a style a little more explicit than hand-written YAML usually
#  is. The benefit is that the examples below are the test fixtures, so they
#  cannot go stale.

info:
  title: PeakFlow API
  version: 1.0.0
  summary: Invoicing, banking and the double-entry ledger underneath them.
  description: |
    The PeakFlow REST API.

    **This document is the contract and it is written before the route.** A
    contract test asserts both directions: every operation and schema here
    exists in the application, and no undocumented route exists on the API
    surface. An API whose documentation is generated from its implementation
    documents whatever the implementation happens to do, including its
    mistakes.

    Conventions in full: `docs/api/conventions.md`. The problem-type registry:
    `docs/api/problems.md`. The points that catch integrators out:

    - **Money is always an object with a string amount.** Never a bare number.
      A client parsing `1.234` (a Jordanian dinar amount) as a float will
      reformat it to `1.23`.
    - **An accounting date is a date, not a timestamp**, and must never be
      timezone-shifted - `2026-11-30T21:00:00Z` in Riyadh is December.
    - **`Idempotency-Key` is required on every POST that posts to the ledger**,
      and a request without one is refused.
    - Pagination is cursor-based. The cursor is opaque and signed.
    - Errors are RFC 9457 `application/problem+json`, with document-rule
      failures addressed by EN 16931 business term.
    - **A token scope is a permission key**, spelled identically. There is no
      second vocabulary for machines.

    Every operation can also answer `500` with a problem document; it is
    described once as the `ServerError` response and referenced from each
    operation rather than being left implicit.
  contact:
    name: PeakFlow
    url: https://github.com/mostfaswaisi93/peakflow
  license:
    name: Proprietary
    url: https://github.com/mostfaswaisi93/peakflow/blob/main/LICENSE

servers:
  - url: https://{tenant}.peakflow.app/api/v1
    description: Production
    variables:
      tenant:
        default: example
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Contract
    description: The document itself.
  - name: Ledger
    description: Accounts and journal entries.
  - name: Identity
    description: The tenant's own API tokens.
  - name: Reports
    description: The figures the browser's own pages show, as data, from the same queries.
  - name: Sales
    description: Sales invoices, read-only.
  - name: Purchasing
    description: Supplier bills, read-only.
  - name: Parties
    description: Customers, suppliers and employees, read-only.
  - name: Banking
    description: The company's own bank accounts, read-only.
  - name: Sessions
    description: |
      A person signing in on a device - a mobile app, say - and their own
      sessions. The credentials are an ordinary short-lived API token and a
      single-use refresh token; everything a session's token may do is
      checked by the same scopes and the same gate as any other token.

paths:

  /openapi.yaml:
    get:
      tags: ["Contract"]
      operationId: getOpenApiDocument
      summary: This document
      description: |
        The contract, served byte for byte from the committed file.

        **Unauthenticated, deliberately.** An integrator reads the contract
        before they have a token - that is what they are reading it in order to
        obtain. Requiring one would mean the first question every integration
        asks is answered by a `401`, and the usual workaround is somebody
        emailing a copy of the file, which is then the version they build
        against for two years.

        It describes shapes and not data: no tenant, no entity, no figure. It
        is also the only operation here with no `X-Tenant`, for the same
        reason.

        The `ETag` is a hash of the bytes rather than a modification time, so
        a client polling for contract changes transfers the document only when
        it has actually changed - a deploy rewrites every mtime.
      security: []
      responses:
        '200':
          description: The OpenAPI document
          headers:
            ETag: {"$ref": "#/components/headers/ETag"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/yaml:
              schema: {"type": "string"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /accounts:
    get:
      tags: ["Ledger"]
      operationId: listAccounts
      summary: The chart of accounts
      description: |
        Cursor-paginated, in code order - which is tree order, because the
        code is the path. A client that wants the tree reassembles it from
        `parent_id`, which every row carries.

        Requires `account.manage`, which is the same permission the chart
        screen requires and for the same reason: the chart names every control
        account in the entity, which is a map of where money lands.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/Cursor"}
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/PageNumber"}
        - name: sort
          in: query
          description: |
            Allowlisted. Anything else is a `400` naming what is permitted - a
            field is sortable when it has an index, and sorting by one that
            has not would ask the database for a full sort of the table.
          schema: {"type": "string", "enum": ["code", "-code", "created_at", "-created_at"], "default": "code"}
      responses:
        '200':
          description: A page of accounts
          headers:
            Link: {"$ref": "#/components/headers/Link"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/AccountPage"}
              examples:
                aPage:
                  summary: The first page of a small chart
                  value: {"data": [{"resource": "account", "id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "code": "1.1.1.1", "name": {"ar": "النقدية", "en": "Cash on hand"}, "parent_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "depth": 4, "type": "asset", "currency": null, "postable": true, "blocked": false, "monetary": true}], "meta": {"limit": 25, "has_more": false, "pagination": "cursor"}, "links": {"self": "https://example.peakflow.app/api/v1/accounts"}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /journal-entries:
    get:
      tags: ["Ledger"]
      operationId: listJournalEntries
      summary: List journal entries
      description: |
        Newest first by accounting date, which is what a client polling for
        what has changed wants and is also the order the index is in.

        `posted_at` is deliberately not sortable: it is nullable, and a keyset
        cursor over a nullable column silently loses rows - the row-value
        comparison evaluates to NULL for them, so the page is short with no
        indication that anything was left out.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/Cursor"}
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/PageNumber"}
        - name: sort
          in: query
          schema: {"type": "string", "enum": ["accounting_date", "-accounting_date", "number", "-number"], "default": "-accounting_date"}
        - name: filter[status]
          in: query
          schema: {"type": "string", "enum": ["draft", "posted", "reversed"]}
      responses:
        '200':
          description: A page of journal entries
          headers:
            Link: {"$ref": "#/components/headers/Link"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/JournalEntryPage"}
              examples:
                aPage:
                  summary: One posted entry
                  value: {"data": [{"resource": "journal_entry", "id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "number": "GEN-2026/00001", "status": "posted", "accounting_date": "2026-03-10", "period_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "journal_id": "01jd3xq7f8k2m9n4p5r6s7t8v7", "narration": "Accrued electricity", "posting_rule": "ledger.manual.api", "source": {"type": "api", "reference": null}, "posted_at": "2026-03-10T09:31:22Z", "posted_by_user_id": "01jd3xq7f8k2m9n4p5r6s7t8v6", "currency": "SAR"}], "meta": {"limit": 25, "has_more": false, "pagination": "cursor"}, "links": {"self": "https://example.peakflow.app/api/v1/journal-entries"}}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

    post:
      tags: ["Ledger"]
      operationId: postJournalEntry
      summary: Post a journal entry
      description: |
        **This posts. There is no draft.**

        The manual entry screen has drafts because a person is interrupted
        halfway through a forty-line accrual. An integration is not
        interrupted, and a draft only it can see is a row nothing will ever
        come back and finish.

        So this is a write that posts to the ledger, which is why
        `Idempotency-Key` is **required**: a retried POST without one posts the
        entry twice, and the second one is indistinguishable from a real
        transaction - same amounts, same date, same party, a different number.

        The entry must balance to zero in the entity's functional currency,
        which is enforced by a deferred constraint trigger in the database and
        not only by this endpoint. A **control account is refused**: its
        balance is the total of a subledger, and a manual entry makes the two
        disagree with nothing afterwards able to say which is right.

        Requires `journal.post`, which the permission catalogue marks as
        needing an enrolled second factor on the person whose token this is.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/JournalEntryRequest"}
            examples:
              anAccrual:
                summary: A two-line accrual in the functional currency
                value: {"accounting_date": "2026-03-10", "narration": "Accrued electricity for March", "lines": [{"account_code": "6.1.5", "amount": "1500.0000", "narration": "March electricity"}, {"account_code": "2.1.9", "amount": "-1500.0000"}]}
      responses:
        '201':
          description: Posted
          headers:
            Location: {"$ref": "#/components/headers/Location"}
            Idempotent-Replay: {"$ref": "#/components/headers/IdempotentReplay"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/JournalEntryDetail"}
              examples:
                posted:
                  summary: The entry, with its lines
                  value: {"resource": "journal_entry", "id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "number": "GEN-2026/00001", "status": "posted", "accounting_date": "2026-03-10", "period_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "journal_id": "01jd3xq7f8k2m9n4p5r6s7t8v7", "narration": "Accrued electricity for March", "posting_rule": "ledger.manual.api", "source": {"type": "api", "reference": null}, "posted_at": "2026-03-10T09:31:22Z", "posted_by_user_id": "01jd3xq7f8k2m9n4p5r6s7t8v6", "currency": "SAR", "lines": [{"id": "01jd3xq7f8k2m9n4p5r6s7t8va", "account_id": "01jd3xq7f8k2m9n4p5r6s7t8vb", "amount": {"amount": "1500.0000", "currency": "SAR", "presentation_exponent": 2}, "functional_amount": {"amount": "1500.0000", "currency": "SAR", "presentation_exponent": 2}, "fx": null, "party_id": null, "narration": "March electricity"}, {"id": "01jd3xq7f8k2m9n4p5r6s7t8vd", "account_id": "01jd3xq7f8k2m9n4p5r6s7t8ve", "amount": {"amount": "-1500.0000", "currency": "SAR", "presentation_exponent": 2}, "functional_amount": {"amount": "-1500.0000", "currency": "SAR", "presentation_exponent": 2}, "fx": null, "party_id": null, "narration": null}]}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '423': {"$ref": "#/components/responses/PeriodClosed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /journal-entries/{id}:
    get:
      tags: ["Ledger"]
      operationId: getJournalEntry
      summary: One journal entry, with its lines
      description: |
        Resolved under the entity scope, so an id belonging to another company
        in the same tenant is a `404` - indistinguishable from one that never
        existed, which is what stops a numbering series being walked from
        outside.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/ResourceId"}
      responses:
        '200':
          description: The entry
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/JournalEntryDetail"}
              examples:
                withAForeignLine:
                  summary: An entry carrying a translated line and its rate's provenance
                  value: {"resource": "journal_entry", "id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "number": "GEN-2026/00002", "status": "posted", "accounting_date": "2026-03-11", "period_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "journal_id": "01jd3xq7f8k2m9n4p5r6s7t8v7", "narration": "Supplier invoice in euro", "posting_rule": "ledger.manual.api", "source": {"type": "api", "reference": null}, "posted_at": "2026-03-11T11:02:04Z", "posted_by_user_id": "01jd3xq7f8k2m9n4p5r6s7t8v6", "currency": "SAR", "lines": [{"id": "01jd3xq7f8k2m9n4p5r6s7t8vc", "account_id": "01jd3xq7f8k2m9n4p5r6s7t8vb", "amount": {"amount": "1000.0000", "currency": "EUR", "presentation_exponent": 2}, "functional_amount": {"amount": "4012.5000", "currency": "SAR", "presentation_exponent": 2}, "fx": {"rate": "4.012500000000", "rate_set": "market", "as_of": "2026-03-11", "provider": "ecb"}, "party_id": null, "narration": null}, {"id": "01jd3xq7f8k2m9n4p5r6s7t8vf", "account_id": "01jd3xq7f8k2m9n4p5r6s7t8vg", "amount": {"amount": "-4012.5000", "currency": "SAR", "presentation_exponent": 2}, "functional_amount": {"amount": "-4012.5000", "currency": "SAR", "presentation_exponent": 2}, "fx": null, "party_id": null, "narration": "The riyal side, at the booking rate"}]}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /api-tokens:
    get:
      tags: ["Identity"]
      operationId: listApiTokens
      summary: The caller's own API tokens
      description: |
        Revoked tokens included, because the question a customer asks is "did
        we already rotate this", and a list of live tokens cannot answer it -
        the rotation chain is only legible when both ends are in it.

        `last_used_at` is the field worth having: the question asked about a
        token found in a configuration file is "is anything still using this",
        and a name and a creation date cannot answer it.

        The permitted scopes are on the response, because the next thing a
        client does is issue a token and the set of valid scopes is the
        permission catalogue - which changes with a deployment. A client that
        kept its own copy would be keeping a copy that goes stale.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The tokens
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/ApiTokenPage"}
              examples:
                oneLiveOneRotated:
                  summary: A live token and the one it replaced
                  value: {"data": [{"resource": "api_token", "id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "name": "Nightly bookkeeping", "plane": "tenant", "scopes": ["report.view"], "entity_ids": ["01jd3xq7f8k2m9n4p5r6s7t8v8"], "created_at": "2026-03-10T09:00:00Z", "last_used_at": "2026-03-11T02:00:11Z", "expires_at": null, "revoked_at": null, "revoked_reason": null, "rotated_to_token_id": null}], "meta": {"available_scopes": ["account.manage", "journal.post", "report.view", "user.manage"], "scopes_requiring_a_person_present": ["payment.release"]}}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

    post:
      tags: ["Identity"]
      operationId: issueApiToken
      summary: Issue a token
      description: |
        **Delegation only ever narrows.** A token may issue a token carrying
        its own scopes or fewer, in its own entities or fewer, and never more.
        Without that rule this operation would be the escalation: a token
        issued to read invoices, holding `user.manage` so that it can rotate
        itself, could otherwise mint one that releases payments - because its
        OWNER holds that permission.

        A scope must also be a permission its owner holds **in every entity
        the token names**, checked per entity rather than once: a user who may
        post in the parent and only read in a subsidiary is the ordinary case,
        and taking the union would hand the token posting rights in the
        subsidiary.

        A permission requiring step-up re-authentication can never be a token
        scope. A step-up assertion proves somebody is at the keyboard now; a
        token in a configuration file proves the opposite.

        **The plaintext is returned exactly once** and there is no endpoint
        that returns it again.

        No `Idempotency-Key`: this does not post to the ledger, and a
        duplicate produces a second token with its own id that the listing
        shows and a human revokes. Requiring a key on every POST would train
        clients to generate one per call, which is the same as not having one.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/ApiTokenRequest"}
            examples:
              aReadOnlyToken:
                summary: A reporting token for one entity
                value: {"name": "Nightly bookkeeping", "scopes": ["report.view"], "entity_ids": ["01jd3xq7f8k2m9n4p5r6s7t8v8"], "expires_on": "2027-03-10"}
      responses:
        '201':
          description: Issued, with the plaintext - once
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/ApiTokenIssued"}
              examples:
                issued:
                  summary: The token and its one and only plaintext
                  value: {"resource": "api_token", "id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "name": "Nightly bookkeeping", "plane": "tenant", "scopes": ["report.view"], "entity_ids": ["01jd3xq7f8k2m9n4p5r6s7t8v8"], "created_at": "2026-03-10T09:00:00Z", "last_used_at": null, "expires_at": "2027-03-10T23:59:59Z", "revoked_at": null, "revoked_reason": null, "rotated_to_token_id": null, "token": "01jd3xq7f8k2m9n4p5r6s7t8v9|pfat_rPq4s...", "issued_at": "2026-03-10T09:00:00Z"}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /api-tokens/{id}/rotate:
    post:
      tags: ["Identity"]
      operationId: rotateApiToken
      summary: Replace a token with a successor
      description: |
        Mints a successor with the same scopes and entities, and revokes this
        one with the reason given - in one transaction, because the two halves
        are a single decision. A rotation that minted the successor and failed
        to revoke the predecessor has doubled the number of live credentials,
        which is the opposite of what somebody rotating after a leak wanted.

        Rotation is two rows and an arrow, never an update. A token whose hash
        changed in place leaves no record that the old credential existed, so
        "which token posted this entry on the 14th" has no answer. A database
        trigger refuses the alternative.

        This operation is why an integration can rotate without a human: a
        rotation that needs somebody to open a screen, paste a token into a
        configuration file and redeploy happens once, during setup, and then
        never.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/ResourceId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/TokenReason"}
            examples:
              scheduled:
                summary: A scheduled rotation
                value: {"reason": "Scheduled quarterly rotation of the bookkeeping credential."}
      responses:
        '201':
          description: The successor, with its plaintext - once
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/ApiTokenIssued"}
              examples:
                rotated:
                  summary: The successor token
                  value: {"resource": "api_token", "id": "01jd3xq7f8k2m9n4p5r6s7t8vd", "name": "Nightly bookkeeping", "plane": "tenant", "scopes": ["report.view"], "entity_ids": ["01jd3xq7f8k2m9n4p5r6s7t8v8"], "created_at": "2026-06-10T09:00:00Z", "last_used_at": null, "expires_at": null, "revoked_at": null, "revoked_reason": null, "rotated_to_token_id": null, "token": "01jd3xq7f8k2m9n4p5r6s7t8vd|pfat_8wQ2x...", "issued_at": "2026-06-10T09:00:00Z"}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /api-tokens/{id}:
    delete:
      tags: ["Identity"]
      operationId: revokeApiToken
      summary: Revoke a token
      description: |
        Revoked, not deleted. "Which token posted this entry" has to stay
        answerable after the token is gone, and a deleted row answers it with
        silence - which reads as "no token", which is worse than "we do not
        know".

        A reason is required, and a database constraint requires it too.
        "Revoked" with no reason cannot distinguish a routine rotation from a
        response to a leak, and those are the two cases somebody will later
        need to tell apart.

        Revocation is final: a trigger refuses an update that clears
        `revoked_at`, because a token revoked after a leak and then
        un-revoked is a compromised credential that is live again, with one
        row saying both things.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/ResourceId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/TokenReason"}
            examples:
              leaked:
                summary: Revoked after the credential was found in a commit
                value: {"reason": "Found committed to a public repository; rotating out of band."}
      responses:
        '200':
          description: The revoked token
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/ApiTokenResource"}
              examples:
                revoked:
                  summary: Revoked, with its reason
                  value: {"resource": "api_token", "id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "name": "Nightly bookkeeping", "plane": "tenant", "scopes": ["report.view"], "entity_ids": ["01jd3xq7f8k2m9n4p5r6s7t8v8"], "created_at": "2026-03-10T09:00:00Z", "last_used_at": "2026-03-11T02:00:11Z", "expires_at": null, "revoked_at": "2026-03-12T08:15:00Z", "revoked_reason": "Found committed to a public repository; rotating out of band.", "rotated_to_token_id": null}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '409': {"$ref": "#/components/responses/Conflict"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /auth/sign-in:
    post:
      tags: ["Sessions"]
      operationId: signIn
      summary: Sign a person in on a device
      description: |
        The password stage. A person with **no second factor** is signed in
        here and receives a `201` with both credentials. A person **with** one
        receives a `202` and a challenge, and is signed in by
        `POST /auth/sign-in/second-factor` - the password alone opens nothing.

        **One refusal for everything.** An unknown workspace, an unknown
        address, a wrong password and a deactivated account are all
        `sign-in-refused` with the same sentence: distinguishing them would
        answer "is this person a customer of yours" to anybody who asks. The
        audit log records which it was.

        **The workspace is a field here**, not `X-Tenant`, because the person
        types it and an unknown one must be refused exactly like a wrong
        password. The response carries the tenant's id, which is what the app
        sends as `X-Tenant` from then on.

        Throttled per account **and** per address by the same budget as the
        browser's sign-in form, so a password cannot be guessed five times in
        one and five more in the other.

        **The access token names one company.** A token's scopes are checked
        in every entity it names, so combining companies would either take
        away what the person may do in one or hand them in another what they
        hold only in the first. It carries exactly what the person holds in
        `entity_id`, less the permissions that need somebody present at the
        moment of the act; switching company is a refresh naming another.
      security: []
      parameters:
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/SignInRequest"}
            examples:
              phone:
                summary: A person signing in on their phone
                value: {"workspace": "acme", "email": "layla@acme.example", "password": "correct horse battery staple", "device_name": "Layla's iPhone"}
      responses:
        '201':
          description: Signed in - the session, with both credentials, once
          headers:
            Cache-Control: {"$ref": "#/components/headers/CacheControlNoStore"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeviceSession"}
              examples:
                signedIn:
                  summary: A person with no second factor, signed in
                  value: {"resource": "device_session", "id": "01jd3xq7f8k2m9n4p5r6s7t8w1", "token_type": "Bearer", "access_token": "01jd3xq7f8k2m9n4p5r6s7t8w2|pfat_3Fq9rT...", "access_token_expires_at": "2026-11-19T10:00:00Z", "refresh_token": "pfrt_Zk81mQ...", "refresh_token_expires_at": "2026-12-19T09:00:00Z", "session_started_at": "2026-11-19T09:00:00Z", "second_factor": null, "tenant": {"id": "01jd3xq7f8k2m9n4p5r6s7t8v0", "slug": "acme", "name": "Acme Trading"}, "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "me": {"resource": "me", "id": "01jd3xq7f8k2m9n4p5r6s7t8v7", "name": "Layla Haddad", "email": "layla@acme.example", "locale": "ar", "second_factor_enrolled": false, "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "scopes": ["account.manage", "report.view"], "entities": [{"id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "code": "ACME", "legal_name": "Acme Trading LLC", "functional_currency": "SAR"}]}}
        '202':
          description: The password was accepted; a second factor is needed
          headers:
            Cache-Control: {"$ref": "#/components/headers/CacheControlNoStore"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/SecondFactorChallenge"}
              examples:
                challenged:
                  summary: Send the code with this challenge
                  value: {"resource": "second_factor_challenge", "challenge": "pfch_eyJpdiI6IkF4...", "expires_at": "2026-11-19T09:05:00Z", "accepts": ["totp", "recovery_code"]}
        '401': {"$ref": "#/components/responses/SignInRefused"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /auth/sign-in/second-factor:
    post:
      tags: ["Sessions"]
      operationId: completeSignIn
      summary: Complete a sign-in with a second factor
      description: |
        The code stage, and the only path that signs in a person who has a
        second factor. Accepts a code from their authenticator app or one of
        their unused recovery codes, in the same field.

        The challenge is **encrypted** - it names an account, and the password
        stage must not reveal which accounts exist - expires after five
        minutes, belongs to the workspace it was opened in, and is **spent
        when it succeeds**: one accepted code opens one session. A WRONG code
        does not spend it, so a person who mistypes does not retype their
        password; the sign-in throttle, charged to the account the challenge
        names, bounds the guessing.

        Every failure - an expired challenge, a tampered one, a spent one, a
        wrong code - is the same `sign-in-refused`.
      security: []
      parameters:
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/SecondFactorRequest"}
            examples:
              code:
                summary: The code from the authenticator app
                value: {"workspace": "acme", "challenge": "pfch_eyJpdiI6IkF4...", "code": "492817"}
      responses:
        '201':
          description: Signed in - the session, with both credentials, once
          headers:
            Cache-Control: {"$ref": "#/components/headers/CacheControlNoStore"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeviceSession"}
              examples:
                signedIn:
                  summary: Signed in with an authenticator code
                  value: {"resource": "device_session", "id": "01jd3xq7f8k2m9n4p5r6s7t8w1", "token_type": "Bearer", "access_token": "01jd3xq7f8k2m9n4p5r6s7t8w2|pfat_3Fq9rT...", "access_token_expires_at": "2026-11-19T10:00:00Z", "refresh_token": "pfrt_Zk81mQ...", "refresh_token_expires_at": "2026-12-19T09:00:00Z", "session_started_at": "2026-11-19T09:00:00Z", "second_factor": "totp", "tenant": {"id": "01jd3xq7f8k2m9n4p5r6s7t8v0", "slug": "acme", "name": "Acme Trading"}, "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "me": {"resource": "me", "id": "01jd3xq7f8k2m9n4p5r6s7t8v7", "name": "Layla Haddad", "email": "layla@acme.example", "locale": "ar", "second_factor_enrolled": true, "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "scopes": ["journal.post", "report.view"], "entities": [{"id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "code": "ACME", "legal_name": "Acme Trading LLC", "functional_currency": "SAR"}]}}
        '401': {"$ref": "#/components/responses/SignInRefused"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /auth/refresh:
    post:
      tags: ["Sessions"]
      operationId: refreshSession
      summary: Exchange a refresh token for the next pair
      description: |
        Spends the refresh token and returns a **new access token and a new
        refresh token** in the same session. The previous access token is
        revoked as part of the exchange, so a device holds one live access
        token at a time.

        **A refresh token works once.** Presented again after it was spent, it
        closes the whole session - every refresh token in it and the access
        token live now - and answers `401`. The device was handed the
        successor and stored it, so whoever presents the spent one holds a
        copy; both hold a credential and the server cannot tell which is the
        person, so both sign in again.

        **Switching company** is a refresh naming `entity_id`. Without one the
        session continues where it was - or, if the person has lost every role
        there, in the first company they can still act in.

        What the new access token may do is re-read from the person's grants
        on every exchange, so a role taken away this morning is gone from the
        phone within the hour without anybody signing out.

        The session ends 90 days after it began however often it is
        refreshed. Throttled per address.
      security: []
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RefreshRequest"}
            examples:
              continue:
                summary: The next pair, in the same company
                value: {"refresh_token": "pfrt_Zk81mQ..."}
              switchCompany:
                summary: The next pair, in another company
                value: {"refresh_token": "pfrt_Zk81mQ...", "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v9"}
      responses:
        '200':
          description: The next pair of credentials, once
          headers:
            Cache-Control: {"$ref": "#/components/headers/CacheControlNoStore"}
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeviceSession"}
              examples:
                refreshed:
                  summary: The same session, with new credentials
                  value: {"resource": "device_session", "id": "01jd3xq7f8k2m9n4p5r6s7t8w1", "token_type": "Bearer", "access_token": "01jd3xq7f8k2m9n4p5r6s7t8w5|pfat_kP2wL8...", "access_token_expires_at": "2026-11-19T11:00:00Z", "refresh_token": "pfrt_aQ70vN...", "refresh_token_expires_at": "2026-12-19T10:00:00Z", "session_started_at": "2026-11-19T09:00:00Z", "second_factor": "totp", "tenant": {"id": "01jd3xq7f8k2m9n4p5r6s7t8v0", "slug": "acme", "name": "Acme Trading"}, "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "me": {"resource": "me", "id": "01jd3xq7f8k2m9n4p5r6s7t8v7", "name": "Layla Haddad", "email": "layla@acme.example", "locale": "ar", "second_factor_enrolled": true, "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "scopes": ["journal.post", "report.view"], "entities": [{"id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "code": "ACME", "legal_name": "Acme Trading LLC", "functional_currency": "SAR"}]}}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '422': {"$ref": "#/components/responses/ValidationFailed"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /auth/sign-out:
    post:
      tags: ["Sessions"]
      operationId: signOut
      summary: Sign this device out
      description: |
        Closes the session the presenting access token belongs to: every
        refresh token in it, and the access token itself. A token that is not
        part of a session - an integration's - is revoked on its own.

        Needs no `X-Entity` and no scope. A sign-out that could be refused
        would be a way to keep somebody signed in.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Signed out
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/SignOutResult"}
              examples:
                signedOut:
                  summary: The session and its credentials are closed
                  value: {"resource": "sign_out", "session_id": "01jd3xq7f8k2m9n4p5r6s7t8w1", "token_id": "01jd3xq7f8k2m9n4p5r6s7t8w5", "signed_out_at": "2026-11-19T17:42:10Z"}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /auth/sessions:
    get:
      tags: ["Sessions"]
      operationId: listDeviceSessions
      summary: Where this person is signed in
      description: |
        The person's open sessions on every device, newest first, with the one
        this request came from marked `current`. What a "signed-in devices"
        screen lists, so that "sign out of the phone I lost" is a choice a
        person can make from a list rather than a request to support.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The open sessions
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeviceSessionList"}
              examples:
                twoDevices:
                  summary: A phone and a tablet
                  value: {"data": [{"resource": "device_session_summary", "id": "01jd3xq7f8k2m9n4p5r6s7t8w1", "device_name": "Layla's iPhone", "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "second_factor": "totp", "started_at": "2026-11-19T09:00:00Z", "last_refreshed_at": "2026-11-19T16:58:03Z", "expires_at": "2026-12-19T16:58:03Z", "revoked_at": null, "current": true}, {"resource": "device_session_summary", "id": "01jd3xq7f8k2m9n4p5r6s7t8w9", "device_name": "Office iPad", "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "second_factor": "totp", "started_at": "2026-10-02T07:15:00Z", "last_refreshed_at": "2026-11-18T08:01:44Z", "expires_at": "2026-12-18T08:01:44Z", "revoked_at": null, "current": false}]}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /auth/sessions/{id}:
    delete:
      tags: ["Sessions"]
      operationId: closeDeviceSession
      summary: Sign one of this person's devices out
      description: |
        Closes that session - its refresh tokens and its live access token -
        from any other device the person is signed in on. Another person's
        session is a `404`, indistinguishable from one that never existed.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
        - {"$ref": "#/components/parameters/ResourceId"}
      responses:
        '200':
          description: The closed session
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeviceSessionSummary"}
              examples:
                closed:
                  summary: The lost phone, signed out
                  value: {"resource": "device_session_summary", "id": "01jd3xq7f8k2m9n4p5r6s7t8w9", "device_name": "Office iPad", "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "second_factor": "totp", "started_at": "2026-10-02T07:15:00Z", "last_refreshed_at": "2026-11-18T08:01:44Z", "expires_at": "2026-12-18T08:01:44Z", "revoked_at": "2026-11-19T17:40:00Z", "current": false}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '404': {"$ref": "#/components/responses/NotFound"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /me:
    get:
      tags: ["Sessions"]
      operationId: getMe
      summary: Who this token is, and what it may do here
      description: |
        The person behind the token, the companies they may switch to, and the
        **token's** scopes in `X-Entity` - not the person's. An app deciding
        whether to show an "Approve" button must ask what THIS credential may
        do; a person's grants can be wider than the token they hold.

        No scope is needed: a person may always ask who they are.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The person, their companies and this token's scopes
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Me"}
              examples:
                me:
                  summary: A person who can act in two companies
                  value: {"resource": "me", "id": "01jd3xq7f8k2m9n4p5r6s7t8v7", "name": "Layla Haddad", "email": "layla@acme.example", "locale": "ar", "second_factor_enrolled": true, "entity_id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "scopes": ["journal.post", "report.view"], "entities": [{"id": "01jd3xq7f8k2m9n4p5r6s7t8v8", "code": "ACME", "legal_name": "Acme Trading LLC", "functional_currency": "SAR"}, {"id": "01jd3xq7f8k2m9n4p5r6s7t8v9", "code": "ACME-JO", "legal_name": "Acme Trading Jordan", "functional_currency": "JOD"}]}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthenticated"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '429': {"$ref": "#/components/responses/RateLimited"}
        '500': {"$ref": "#/components/responses/ServerError"}

  /overview:
    get:
      tags: ["Reports"]
      operationId: getOverview
      summary: The company at a glance
      description: |
        The browser's home page as data, **from the same query** - so a phone
        and a desk can never disagree about how much cash there is: the cash
        position and its daily series, receivables by age, payables due,
        bank reconciliation progress, drafts waiting, the next tax return and
        the latest activity.

        Every amount is in the company's functional `currency`, and every
        amount is a `Money` object - including each point of the cash series,
        because the chart is exactly where somebody would reach for a float.
        Documents in other currencies are counted in
        `other_currency_documents` rather than converted at a rate nobody
        chose.

        Needs `report.view`.
      parameters:
        - {"$ref": "#/components/parameters/Tenant"}
        - {"$ref": "#/components/parameters/Entity"}
        - {"$ref": "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The overview
          headers:
            Content-Language: {"$ref": "#/components/headers/ContentLanguage"}
